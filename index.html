<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17392b">
<title>Torti — Recuperación V4</title>
<style>
:root{--bg:#f5f2ea;--card:#fffdf8;--ink:#173028;--muted:#6f7b75;--line:#e4e2da;--green:#17392b;--soft:#edf4ef}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh}.app{max-width:720px;margin:auto;padding:0 14px 90px}.top{display:flex;justify-content:space-between;align-items:center;padding:calc(18px + env(safe-area-inset-top)) 4px 14px}.top small{color:var(--muted);font-weight:800;letter-spacing:.08em}.top h1{font-size:34px;margin:4px 0}.badge{background:var(--green);color:white;border-radius:18px;padding:10px 12px;font-size:12px;font-weight:800}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin:10px 0}.card h2,.card h3{margin:0 0 10px}.muted{color:var(--muted);font-size:13px;line-height:1.45}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.metric{background:var(--soft);padding:12px;border-radius:16px}.metric small,.metric b{display:block}.metric b{font-size:21px;margin-top:4px}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(720px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#fffdf8;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}.nav button{border:0;background:none;min-height:62px;color:#596960;font-weight:700}.nav button.on{color:var(--green)}.form label{display:block;font-size:13px;font-weight:700;margin:10px 0}.form input,.form select{width:100%;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:12px;background:white}.form button,.btn{width:100%;border:0;border-radius:14px;padding:13px;background:var(--green);color:white;font-weight:800}.row{padding:11px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}.task{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}.task:first-child{border-top:0}.task span{font-size:22px}.task b,.task small{display:block}.task small{color:var(--muted);margin-top:3px}.notice{background:#edf4ef;border-radius:16px;padding:12px;font-weight:700}.error{background:#fbe8e5;color:#7d332f;padding:12px;border-radius:14px;white-space:pre-wrap}.hidden{display:none}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top"><div><small>TORTI · V4 RESCATE</small><h1>Torti 🐢</h1><div class="muted">Versión autónoma de recuperación</div></div><div class="badge">ONLINE</div></header>
  <main id="main"><section class="card"><h2>Recuperando Torti…</h2><p class="muted">Esta versión no depende de archivos externos. Si puedes leer esto, GitHub Pages ya está cargando correctamente.</p></section></main>
</div>
<nav class="nav" id="nav">
<button data-view="home" class="on">Inicio</button><button data-view="weight">Peso</button><button data-view="food">Comida</button><button data-view="care">Calendario</button><button data-view="more">Torti</button>
</nav>
<script>
(function(){
'use strict';
var KEY='torti-v1-data';
var main=document.getElementById('main');
var nav=document.getElementById('nav');
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function today(){var d=new Date(),m=d.getMonth()+1,day=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(day<10?'0':'')+day}
function load(){var x={records:[],tasks:[],checks:{},routines:[]};try{var raw=localStorage.getItem(KEY);if(raw){var y=JSON.parse(raw);for(var k in y)x[k]=y[k]}}catch(e){}if(!Array.isArray(x.records))x.records=[];return x}
var state=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){} }
function addRecord(type,data){state.records.push({id:'r'+Date.now()+Math.random(),type:type,date:today(),data:data||{},created:Date.now()});save()}
function records(type){var a=[];for(var i=0;i<state.records.length;i++)if(state.records[i]&&state.records[i].type===type)a.push(state.records[i]);return a}
function latest(type){var a=records(type);return a.length?a[a.length-1]:null}
function setNav(view){var bs=nav.getElementsByTagName('button');for(var i=0;i<bs.length;i++)bs[i].className=bs[i].getAttribute('data-view')===view?'on':''}
function render(view){setNav(view);try{
if(view==='home'){var w=latest('peso'),f=latest('comida');main.innerHTML='<section class="card"><h2>✅ Torti volvió a cargar</h2><div class="notice">Tus datos locales siguen intactos.</div><div class="grid" style="margin-top:10px"><div class="metric"><small>Registros</small><b>'+state.records.length+'</b></div><div class="metric"><small>Último peso</small><b>'+(w&&w.data&&w.data.weight?esc(w.data.weight)+' g':'—')+'</b></div></div><p class="muted">Última comida: '+(f&&f.data?esc(f.data.food||'registrada'):'sin registro')+'</p></section><section class="card"><h3>Estado</h3><p class="muted">Esta edición está hecha en un solo archivo para evitar el fallo que dejó la aplicación en blanco.</p></section>';return}
if(view==='weight'){var ws=records('peso').slice(-8).reverse();main.innerHTML='<section class="card"><h2>Registrar peso</h2><form id="wf" class="form"><label>Peso (g)<input name="weight" type="number" required></label><label>Largo (cm)<input name="length" type="number" step="0.1"></label><label>Ancho (cm)<input name="width" type="number" step="0.1"></label><button>Guardar</button></form></section><section class="card"><h3>Últimas mediciones</h3>'+ (ws.length?ws.map(function(r){return '<div class="row"><b>'+esc((r.data||{}).weight||'—')+' g</b><div class="muted">'+esc(r.date||'')+'</div></div>'}).join(''):'<p class="muted">Sin mediciones todavía.</p>')+'</section>';document.getElementById('wf').onsubmit=function(e){e.preventDefault();var f=new FormData(e.target);addRecord('peso',{weight:f.get('weight'),length:f.get('length'),width:f.get('width')});render('weight')};return}
if(view==='food'){var fs=records('comida').slice(-10).reverse();main.innerHTML='<section class="card"><h2>Registrar comida</h2><form id="ff" class="form"><label>Alimento<input name="food" required></label><label>Apetito<select name="appetite"><option>Bueno</option><option>Regular</option><option>Bajo</option><option>No comió</option></select></label><button>Guardar</button></form></section><section class="card"><h3>Comidas recientes</h3>'+(fs.length?fs.map(function(r){return '<div class="row"><b>'+esc((r.data||{}).food||'—')+'</b><div class="muted">'+esc(r.date||'')+' · '+esc((r.data||{}).appetite||'')+'</div></div>'}).join(''):'<p class="muted">Sin comidas registradas.</p>')+'</section>';document.getElementById('ff').onsubmit=function(e){e.preventDefault();var f=new FormData(e.target);addRecord('comida',{food:f.get('food'),appetite:f.get('appetite')});render('food')};return}
if(view==='care'){var plan=[['💧','08:00','Cambiar agua','Diario'],['🌡️','08:15','Revisar temperatura y humedad','Diario'],['🥬','09:00','Comida principal','Diario'],['🧹','18:30','Retirar restos y suciedad','Diario'],['❤️','Domingo','Chequeo visual','Semanal'],['⚖️','Cada 30 días','Peso y medidas','Mensual'],['📸','Cada 30 días','Fotos de caparazón','Mensual'],['🛁','Editable','Baño / remojo','Según pauta veterinaria']];main.innerHTML='<section class="card"><h2>Calendario de cuidados</h2><p class="muted">Agenda segura temporal. Después reconstruiremos la vista día/semana/mes sin romper el arranque.</p>'+plan.map(function(x){return '<div class="task"><span>'+x[0]+'</span><div><b>'+x[2]+'</b><small>'+x[1]+' · '+x[3]+'</small></div></div>'}).join('')+'</section>';return}
main.innerHTML='<section class="card"><h2>Torti</h2><p class="muted">Puedes exportar una copia de los datos recuperados.</p><button class="btn" id="backup">Exportar respaldo JSON</button></section>';document.getElementById('backup').onclick=function(){try{var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='torti-rescate-'+today()+'.json';a.click()}catch(e){alert('No se pudo exportar el respaldo.')}};
}catch(err){main.innerHTML='<section class="card"><h2>Error visible</h2><div class="error">'+esc(err&&err.message?err.message:String(err))+'</div></section>'}}
nav.onclick=function(e){var t=e.target;while(t&&t!==nav&&!t.getAttribute('data-view'))t=t.parentNode;if(t&&t.getAttribute)render(t.getAttribute('data-view'))};
window.onerror=function(msg,src,line,col,err){main.innerHTML='<section class="card"><h2>Error de JavaScript</h2><div class="error">'+esc(msg)+'\nLínea '+line+'</div></section>';return false};
render('home');
})();
</script>
</body>
</html>
