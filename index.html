<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f2f24"><title>Torti — Mi tortuga</title><style>:root{--bg:#f3f0e7;--card:#fffdf8;--ink:#183129;--muted:#748079;--line:#e7e2d7;--green:#123a2d;--soft:#edf4ef;--sand:#f1e1bd}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}.app{max-width:760px;margin:auto;padding:0 12px 116px}.top{display:flex;justify-content:space-between;align-items:center;padding:calc(18px + env(safe-area-inset-top)) 4px 12px}.brand small{display:block;color:var(--muted);font-weight:900;letter-spacing:.11em;font-size:11px}.brand h1{font-size:34px;margin:5px 0 3px}.brand p,.muted{margin:0;color:var(--muted);font-size:13px;line-height:1.45}.avatar{width:58px;height:58px;border-radius:21px;background:#173f31;display:grid;place-items:center;color:white;font-size:30px;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.hero,.budget{background:linear-gradient(135deg,#173f31,#285746);color:white;border-radius:28px;padding:20px;margin:5px 0 14px}.hero h2,.budget h2{font-size:27px;margin:8px 0}.hero p{opacity:.82}.hero-grid,.budget-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:17px}.hero-metric,.budget-box{background:rgba(255,255,255,.11);border-radius:16px;padding:11px}.hero-metric small,.hero-metric b,.budget-box small,.budget-box b{display:block}.hero-metric b,.budget-box b{font-size:17px;margin-top:3px}.section-title{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:20px 5px 9px}.section-title h2{font-size:22px;margin:0}.section-title span{font-size:12px;color:var(--muted);text-align:right}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:17px;margin:10px 0}.card h3{margin:0 0 10px}.grid,.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick button{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:15px;text-align:left;color:var(--ink);min-height:88px}.quick span{font-size:25px;display:block;margin-bottom:8px}.quick b,.quick small{display:block}.quick small{color:var(--muted);margin-top:3px}.metric{background:var(--soft);padding:13px;border-radius:18px}.metric small,.metric b{display:block}.metric small{color:var(--muted);font-size:11px}.metric b{font-size:20px;margin-top:4px}.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}.ico{width:42px;height:42px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:20px;flex:0 0 42px}.grow{min-width:0;flex:1}.row b,.row small{display:block}.row small{color:var(--muted);font-size:12px;margin-top:3px}.form label{display:block;font-size:13px;font-weight:800;margin:12px 0}.form input,.form select{width:100%;font-size:16px;padding:13px;border:1px solid var(--line);border-radius:14px;background:white}.form button,.btn{width:100%;border:0;border-radius:15px;padding:14px;background:var(--green);color:white;font-weight:850}.meal-card{background:linear-gradient(135deg,#f4ecd9,#eee0be);border:1px solid #ead8ae;border-radius:24px;padding:17px}.meal-top{display:flex;gap:12px;align-items:flex-start}.meal-card h3{font-size:23px;margin:5px 0}.meal-card button{border:0;border-radius:13px;padding:12px 14px;margin-top:14px;font-weight:900;background:#fff8e9;color:#684d25}.meal-card button.done{background:var(--green);color:white}.task{display:grid;grid-template-columns:42px minmax(0,1fr);gap:12px;padding:15px 0;border-top:1px solid var(--line)}.task:first-child{border-top:0}.task-copy{min-width:0}.task-title{display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}.task-time{font-size:13px;font-weight:900;color:var(--green);white-space:nowrap}.task-name{font-size:16px;font-weight:850;line-height:1.25}.task-desc{display:block;color:var(--muted);font-size:13px;line-height:1.4;margin-top:5px}.task-action{margin-top:9px;border:0;background:var(--soft);color:var(--green);font-weight:900;border-radius:12px;padding:9px 13px}.task.done{opacity:.62}.task.done .task-name{text-decoration:line-through}.task.done .task-action{background:var(--green);color:white}.calendar-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.daybtn{border:1px solid var(--line);background:white;border-radius:15px;padding:9px 2px;text-align:center;color:var(--ink)}.daybtn small,.daybtn b{display:block}.daybtn.on{background:var(--green);color:white}.saving{background:#eaf4ec;border:1px solid #d4e7d8;border-radius:18px;padding:14px;margin:11px 0}.saving b{display:block;margin-bottom:5px}.shop-item{display:grid;grid-template-columns:44px minmax(0,1fr);gap:11px;padding:15px 0;border-top:1px solid var(--line)}.shop-item:first-child{border-top:0}.shop-main{min-width:0}.shop-main b{display:block;font-size:16px}.shop-main small{display:block;color:var(--muted);line-height:1.4;margin-top:4px}.shop-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:9px}.shop-price{font-weight:900;font-size:17px}.buy-btn{border:0;background:var(--soft);color:var(--green);font-weight:900;border-radius:12px;padding:9px 12px}.buy-btn.done{background:var(--green);color:white}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(760px,100%);display:grid;grid-template-columns:repeat(6,1fr);background:rgba(255,253,248,.96);border-top:1px solid var(--line);padding:7px 3px calc(7px + env(safe-area-inset-bottom));z-index:20;backdrop-filter:blur(20px)}.nav button{border:0;background:none;min-height:58px;color:#7b867f;font-weight:750;font-size:9px;border-radius:15px}.nav button i{display:block;font-style:normal;font-size:20px}.nav button.on{color:var(--green);background:#edf4ef}.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:#17392b;color:white;padding:11px 15px;border-radius:999px;font-size:12px;font-weight:800;opacity:0;transition:.2s;z-index:30}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:430px){.hero-grid,.budget-grid{grid-template-columns:1fr 1fr}.hero-metric:last-child,.budget-box:last-child{grid-column:1/-1}.nav button{font-size:8px}.nav button i{font-size:19px}.section-title h2{font-size:21px}}</style></head><body><div class="app"><header class="top"><div class="brand"><small>TORTI · V4.3</small><h1>Torti</h1><p>Mi tortuga · seguimiento diario</p></div><div class="avatar" id="avatar">🐢</div></header><main id="main"></main></div><nav class="nav" id="nav"><button data-view="home" class="on"><i>⌂</i>Inicio</button><button data-view="weight"><i>↗</i>Crece</button><button data-view="food"><i>🥬</i>Comida</button><button data-view="care"><i>📅</i>Agenda</button><button data-view="shop"><i>🛒</i>Compras</button><button data-view="more"><i>🐢</i>Torti</button></nav><div class="toast" id="toast"></div><script>(function(){'use strict';var KEY='torti-v1-data',PHOTO='torti-v1-photo',CARE='torti-v4-stable-care',SHOP='torti-v4-shopping';var main=document.getElementById('main'),nav=document.getElementById('nav'),toastEl=document.getElementById('toast');function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function pad(n){return n<10?'0'+n:String(n)}function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}function date(s){var p=String(s).split('-');return new Date(+p[0],+p[1]-1,+p[2],12)}function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}function addDays(s,n){var d=date(s);d.setDate(d.getDate()+n);return iso(d)}function fmt(s){try{return new Intl.DateTimeFormat('es-PE',{day:'numeric',month:'short'}).format(date(s))}catch(e){return s}}function load(){var x={records:[]};try{var y=JSON.parse(localStorage.getItem(KEY)||'{}');for(var k in y)x[k]=y[k]}catch(e){}if(!Array.isArray(x.records))x.records=[];return x}var state=load(),care={selected:today(),done:{}};try{var c=JSON.parse(localStorage.getItem(CARE)||'{}');for(var ck in c)care[ck]=c[ck]}catch(e){}if(!care.done)care.done={};var lowItems=[['🥬','Hojas económicas de mercado',4,3,'Compra semanal: escarola, berros y hojas disponibles.'],['🌿','Morera / hibisco',2,3,'Compra 2 atados o porciones al mes. Si consigues hojas seguras sin pesticidas, reduce este gasto.'],['🥒','Zapallo y verdura de rotación',2,3,'Compra porciones pequeñas para repartir durante el mes.'],['🍓','Fruta ocasional',1,3,'Una porción pequeña al mes.'],['💧','Agua y lavado de recipiente',1,0,'Usa agua de casa; sin gasto extra asignado.'],['🧽','Limpieza básica',1,4,'Cepillo o esponja dedicada.'],['🌱','Reserva para sustrato',1,8,'Fondo mensual para cuando toque reponer.'],['☀️','Reserva UVB / iluminación',1,8,'Ahorro mensual para reemplazo futuro.'],['🧴','Reserva de calcio',1,5,'Fondo mensual; suele durar más de un mes.']];var shop={month:today().slice(0,7),bought:{},items:lowItems,budgetVersion:'low-v3'};try{var sh=JSON.parse(localStorage.getItem(SHOP)||'{}');if(sh.bought)shop.bought=sh.bought;if(sh.month)shop.month=sh.month;if(sh.budgetVersion==='low-v3'&&Array.isArray(sh.items))shop.items=sh.items}catch(e){}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function saveCare(){localStorage.setItem(CARE,JSON.stringify(care))}function saveShop(){localStorage.setItem(SHOP,JSON.stringify(shop))}saveShop();function records(t){return state.records.filter(function(r){return r&&r.type===t}).sort(function(a,b){return String(a.date||'').localeCompare(String(b.date||''))})}function latest(t){var a=records(t);return a.length?a[a.length-1]:null}function addRecord(t,d,dt){state.records.push({id:'r'+Date.now()+Math.random(),type:t,date:dt||today(),data:d||{},created:Date.now()});save()}function toast(t){toastEl.textContent=t;toastEl.className='toast show';clearTimeout(toast.x);toast.x=setTimeout(function(){toastEl.className='toast'},1500)}function setNav(v){Array.prototype.forEach.call(nav.querySelectorAll('button'),function(b){b.className=b.getAttribute('data-view')===v?'on':''})}var ph='';try{ph=localStorage.getItem(PHOTO)||''}catch(e){}if(ph)document.getElementById('avatar').innerHTML='<img src="'+ph+'">';var monthMenus=[['Hojas de mercado + morera','Usa principalmente las hojas semanales y una parte de la morera.'],['Hojas de mercado + zapallo','Añade una porción pequeña de zapallo a las hojas.'],['Hojas de mercado','Día sencillo usando la compra semanal.'],['Hojas de mercado + morera','Segunda rotación de morera/hibisco.'],['Hojas de mercado + verdura de rotación','Usa otra pequeña porción de la verdura comprada.'],['Hojas de mercado','Mantén variedad dentro de las hojas disponibles.'],['Hojas de mercado + fruta ocasional','Solo una pequeña cantidad de fruta; el resto son hojas.']];function menuFor(s){return monthMenus[(date(s).getDay()+6)%7]}function tasks(s){var a=[['water','💧','08:00','Cambiar agua','Agua limpia y recipiente revisado'],['hab','🌡️','08:15','Revisar hábitat','Temperatura, humedad, UVB y estado general'],['meal','🥬','09:00','Comida principal',menuFor(s)[0]],['clean','🧹','18:30','Limpieza rápida','Retirar restos y suciedad visible']];if(date(s).getDay()===0)a.push(['health','❤️','10:00','Chequeo visual','Actividad, ojos, nariz, caparazón y heces']);return a}function k(s,id){return s+':'+id}function done(s,id){return !!care.done[k(s,id)]}function completion(s){var a=tasks(s),n=0;a.forEach(function(t){if(done(s,t[0]))n++});return Math.round(n/a.length*100)}function toggleTask(id){var kk=k(care.selected,id);if(care.done[kk])delete care.done[kk];else care.done[kk]=1;saveCare();render('care')}function totalShop(){return shop.items.reduce(function(sum,x){return sum+(+x[2]||0)*(+x[3]||0)},0)}function boughtTotal(){return shop.items.reduce(function(sum,x,i){return sum+(shop.bought[i]?(+x[2]||0)*(+x[3]||0):0)},0)}function home(){var w=latest('peso'),pend=tasks(today()).filter(function(t){return !done(today(),t[0])}).length;return '<section class="hero"><small>ASÍ ESTÁ TORTI HOY</small><h2>Todo lo importante, sin buscarlo.</h2><p>La comida diaria ahora sale de la misma compra mínima del mes.</p><div class="hero-grid"><div class="hero-metric"><small>Último peso</small><b>'+(w&&w.data&&w.data.weight?esc(w.data.weight)+' g':'Pendiente')+'</b></div><div class="hero-metric"><small>Agenda</small><b>'+completion(today())+'%</b></div><div class="hero-metric"><small>Presupuesto</small><b>S/ '+totalShop().toFixed(0)+'</b></div></div></section><div class="section-title"><h2>Accesos rápidos</h2><span>'+state.records.length+' registros</span></div><div class="quick"><button data-jump="weight"><span>⚖️</span><b>Registrar peso</b><small>Medidas</small></button><button data-jump="food"><span>🥬</span><b>Comida</b><small>Menú de las compras</small></button><button data-jump="care"><span>📅</span><b>Agenda</b><small>'+pend+' pendientes</small></button><button data-jump="shop"><span>🛒</span><b>Compras</b><small>Presupuesto mínimo</small></button></div>'}function weight(){var a=records('peso').slice(-8).reverse();return '<div class="section-title"><h2>Crecimiento</h2></div><section class="card"><h3>Nueva medición</h3><form id="wf" class="form"><div class="grid"><label>Peso (g)<input name="weight" type="number" required></label><label>Fecha<input name="date" type="date" value="'+today()+'"></label></div><button>Guardar</button></form></section><section class="card"><h3>Historial</h3>'+a.map(function(r){return '<div class="row"><div class="ico">⚖️</div><div class="grow"><b>'+esc((r.data||{}).weight||'—')+' g</b><small>'+fmt(r.date)+'</small></div></div>'}).join('')+'</section>'}function food(){var a=records('comida').slice(-8).reverse(),m=menuFor(today());return '<div class="section-title"><h2>Nutrición</h2><span>basada en compras del mes</span></div><section class="meal-card"><div class="meal-top"><div class="ico">🥬</div><div class="grow"><small class="muted">MENÚ DE HOY</small><h3>'+esc(m[0])+'</h3><div class="muted">'+esc(m[1])+'</div></div></div></section><section class="card"><form id="ff" class="form"><label>Alimento<input name="food" value="'+esc(m[0])+'" required></label><div class="grid"><label>Apetito<select name="appetite"><option>Bueno</option><option>Regular</option><option>Bajo</option><option>No comió</option></select></label><label>Fecha<input name="date" type="date" value="'+today()+'"></label></div><button>Guardar comida</button></form></section><section class="card"><h3>Recientes</h3>'+a.map(function(r){return '<div class="row"><div class="ico">🥬</div><div class="grow"><b>'+esc((r.data||{}).food||'—')+'</b><small>'+fmt(r.date)+'</small></div></div>'}).join('')+'</section>'}function careView(){var d=date(care.selected),dow=(d.getDay()+6)%7;d.setDate(d.getDate()-dow);var days=[];for(var i=0;i<7;i++)days.push(addDays(iso(d),i));var all=tasks(care.selected),chores=[];all.forEach(function(t){if(t[0]!=='meal')chores.push(t)});var m=menuFor(care.selected),mealDone=done(care.selected,'meal');return '<div class="section-title"><h2>Agenda</h2><span>'+completion(care.selected)+'% listo</span></div><section class="card"><div class="calendar-strip">'+days.map(function(x){return '<button class="daybtn '+(x===care.selected?'on':'')+'" data-day="'+x+'"><small>'+['D','L','M','M','J','V','S'][date(x).getDay()]+'</small><b>'+date(x).getDate()+'</b></button>'}).join('')+'</div></section><div class="section-title"><h2>Comida</h2><span>'+fmt(care.selected)+'</span></div><section class="meal-card"><div class="meal-top"><div class="ico">🥬</div><div class="grow"><small class="muted">09:00 · DEL PRESUPUESTO MENSUAL</small><h3>'+esc(m[0])+'</h3><div class="muted">'+esc(m[1])+'</div></div></div><button class="'+(mealDone?'done':'')+'" data-task="meal">'+(mealDone?'✓ Comida hecha':'Marcar comida')+'</button></section><div class="section-title"><h2>Quehaceres</h2><span>sin comida</span></div><section class="card">'+chores.map(function(t){var is=done(care.selected,t[0]);return '<div class="task '+(is?'done':'')+'"><div class="ico">'+t[1]+'</div><div class="task-copy"><div class="task-title"><span class="task-time">'+t[2]+'</span><span class="task-name">'+esc(t[3])+'</span></div><span class="task-desc">'+esc(t[4])+'</span><button class="task-action" data-task="'+t[0]+'">'+(is?'✓ Hecho':'Marcar')+'</button></div></div>'}).join('')+'</section>'}function shopView(){var total=totalShop(),spent=boughtTotal(),left=Math.max(0,total-spent);return '<div class="section-title"><h2>Compras mínimas</h2><span>'+shop.month+'</span></div><section class="budget"><small>PRESUPUESTO MENSUAL</small><h2>S/ '+total.toFixed(2)+'</h2><div class="budget-grid"><div class="budget-box"><small>Comprado</small><b>S/ '+spent.toFixed(2)+'</b></div><div class="budget-box"><small>Falta</small><b>S/ '+left.toFixed(2)+'</b></div><div class="budget-box"><small>Semana</small><b>S/ '+(total/4.3).toFixed(2)+'</b></div></div></section><div class="saving"><b>🥬 Compra una vez, reparte todo el mes</b><span class="muted">El menú semanal usa únicamente estas categorías. Así puedes dividir las compras y evitar ingredientes que aparecen en la agenda pero no están presupuestados.</span></div><section class="card"><h3>Lista sugerida</h3>'+shop.items.map(function(x,i){var subtotal=(+x[2]||0)*(+x[3]||0),is=!!shop.bought[i];return '<div class="shop-item"><div class="ico">'+x[0]+'</div><div class="shop-main"><b>'+esc(x[1])+'</b><small>'+esc(x[4])+'</small><small>'+x[2]+' × S/ '+(+x[3]).toFixed(2)+'</small><div class="shop-foot"><span class="shop-price">S/ '+subtotal.toFixed(2)+'</span><button class="buy-btn '+(is?'done':'')+'" data-buy="'+i+'">'+(is?'✓':'Comprar')+'</button></div></div></div>'}).join('')+'</section><section class="card"><h3>Ajustar precios</h3><form id="shopform" class="form"><label>Producto<select name="idx">'+shop.items.map(function(x,i){return '<option value="'+i+'">'+esc(x[1])+'</option>'}).join('')+'</select></label><div class="grid"><label>Cantidad/mes<input name="qty" type="number" min="0" step="1"></label><label>Precio unitario S/<input name="price" type="number" min="0" step=".1"></label></div><button>Actualizar</button></form><p class="muted">Morera/hibisco ahora tiene S/3 por porción como referencia y sigue siendo editable.</p></section>'}function more(){return '<div class="section-title"><h2>Ficha de Torti</h2></div><section class="card"><div class="row"><div class="ico">🐢</div><div class="grow"><b>Torti</b><small>Hembra · Chelonoidis denticulatus</small></div></div><div class="grid"><div class="metric"><small>Registros</small><b>'+state.records.length+'</b></div><div class="metric"><small>Presupuesto</small><b>S/ '+totalShop().toFixed(0)+'</b></div></div></section><section class="card"><button class="btn" id="backup">Exportar respaldo JSON</button></section>'}function bind(v){if(v==='home')main.querySelectorAll('[data-jump]').forEach(function(b){b.onclick=function(){render(this.getAttribute('data-jump'))}});if(v==='weight'){var wf=document.getElementById('wf');if(wf)wf.onsubmit=function(e){e.preventDefault();var f=new FormData(this);addRecord('peso',{weight:f.get('weight')},f.get('date'));toast('Medición guardada');render('weight')}}if(v==='food'){var ff=document.getElementById('ff');if(ff)ff.onsubmit=function(e){e.preventDefault();var f=new FormData(this);addRecord('comida',{food:f.get('food'),appetite:f.get('appetite')},f.get('date'));toast('Comida guardada');render('food')}}if(v==='care'){main.querySelectorAll('[data-day]').forEach(function(b){b.onclick=function(){care.selected=this.getAttribute('data-day');saveCare();render('care')}});main.querySelectorAll('[data-task]').forEach(function(b){b.onclick=function(){toggleTask(this.getAttribute('data-task'));toast('Agenda actualizada')}})}if(v==='shop'){main.querySelectorAll('[data-buy]').forEach(function(b){b.onclick=function(){var i=this.getAttribute('data-buy');shop.bought[i]=!shop.bought[i];saveShop();render('shop')}});var sf=document.getElementById('shopform');if(sf)sf.onsubmit=function(e){e.preventDefault();var f=new FormData(this),i=+f.get('idx');if(f.get('qty')!=='')shop.items[i][2]=+f.get('qty');if(f.get('price')!=='')shop.items[i][3]=+f.get('price');saveShop();toast('Presupuesto actualizado');render('shop')}}if(v==='more'){var b=document.getElementById('backup');if(b)b.onclick=function(){var blob=new Blob([JSON.stringify({state:state,care:care,shop:shop},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='torti-backup-'+today()+'.json';a.click()}}}function render(v){setNav(v);try{main.innerHTML=v==='home'?home():v==='weight'?weight():v==='food'?food():v==='care'?careView():v==='shop'?shopView():more();bind(v);scrollTo(0,0)}catch(err){main.innerHTML='<section class="card"><h3>Error</h3><p>'+esc(err.message||err)+'</p></section>'}}nav.onclick=function(e){var t=e.target;while(t&&t!==nav&&!t.getAttribute('data-view'))t=t.parentNode;if(t&&t.getAttribute)render(t.getAttribute('data-view'))};render('home')})();</script></body></html>
