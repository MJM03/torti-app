%;bottom:0;transform:translateX(-50%);width:min(760px,100%);display:grid;grid-template-columns:repeat(6,1fr);background:rgba(255,253,248,.96);border-top:1px solid var(--line);padding:7px 3px calc(7px + env(safe-area-inset-bottom));z-index:20;backdrop-filter:blur(20px)}.nav button{border:0;background:none;min-height:58px;color:#7b867f;font-weight:750;font-size:9px;border-radius:15px}.nav button i{display:block;font-style:normal;font-size:20px}.nav button.on{color:var(--green);background:#edf4ef}.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:#17392b;color:white;padding:11px 15px;border-radius:999px;font-size:12px;font-weight:800;opacity:0;transition:.2s;z-index:30}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:430px){.hero-grid,.budget-grid,.projection{grid-template-columns:1fr 1fr}.hero-metric:last-child,.budget-box:last-child,.projection .metric:last-child{grid-column:1/-1}.nav button{font-size:8px}.nav button i{font-size:19px}.section-title h2{font-size:21px}}</style></head><body><div class="app"><header class="top"><div class="brand"><small>TORTI · V4.4</small><h1>Torti</h1><p>Mi tortuga · seguimiento diario</p></div><div class="avatar" id="avatar">🐢</div></header><main id="main"></main></div><nav class="nav" id="nav"><button data-view="home" class="on"><i>⌂</i>Inicio</button><button data-view="weight"><i>↗</i>Crece</button><button data-view="food"><i>🥬</i>Comida</button><button data-view="care"><i>📅</i>Agenda</button><button data-view="shop"><i>🛒</i>Compras</button><button data-view="more"><i>🐢</i>Torti</button></nav><div class="toast" id="toast"></div><script>(function(){'use strict';var KEY='torti-v1-data',PHOTO='torti-v1-photo',CARE='torti-v4-stable-care',SHOP='torti-v4-shopping',PROFILE='torti-v4-profile';var main=document.getElementById('main'),nav=document.getElementById('nav'),toastEl=document.getElementById('toast');function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function pad(n){return n<10?'0'+n:String(n)}function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}function date(s){var p=String(s).split('-');return new Date(+p[0],+p[1]-1,+p[2],12)}function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}function addDays(s,n){var d=date(s);d.setDate(d.getDate()+n);return iso(d)}function fmt(s){try{return new Intl.DateTimeFormat('es-PE',{day:'numeric',month:'short'}).format(date(s))}catch(e){return s}}function load(){var x={records:[]};try{var y=JSON.parse(localStorage.getItem(KEY)||'{}');for(var k in y)x[k]=y[k]}catch(e){}if(!Array.isArray(x.records))x.records=[];return x}var state=load(),care={selected:today(),done:{}};try{var c=JSON.parse(localStorage.getItem(CARE)||'{}');for(var ck in c)care[ck]=c[ck]}catch(e){}if(!care.done)care.done={};var profile={ageYears:3};try{var pr=JSON.parse(localStorage.getItem(PROFILE)||'{}');if(pr.ageYears)profile.ageYears=+pr.ageYears}catch(e){}var lowItems=[['🥬','Escarola',2,3,'2 unidades o porciones al mes.'],['🌿','Berros',2,2.5,'2 atados pequeños al mes.'],['🥬','Endivia',1,4,'1 unidad para rotación.'],['🌿','Morera',2,3,'2 porciones/atados al mes. Si tienes una fuente segura sin pesticidas, puedes bajar este gasto.'],['🌺','Hibisco',1,3,'Flores u hojas de fuente segura; compra solo si no tienes acceso seguro.'],['🎃','Zapallo',2,2.5,'2 porciones pequeñas al mes.'],['🍈','Papaya',1,3,'1 porción pequeña al mes para fruta ocasional.'],['🍓','Fresa',1,2,'Porción pequeña para rotación ocasional.'],['💧','Agua y lavado de recipiente',1,0,'Agua de casa; sin gasto extra asignado.'],['🧽','Esponja/cepillo exclusivo',1,4,'Solo si toca reemplazarlo.'],['🌱','Reserva para sustrato',1,8,'Fondo mensual para reposición.'],['☀️','Reserva UVB / iluminación',1,8,'Ahorro mensual para reemplazo futuro.'],['🧴','Reserva de calcio',1,5,'Fondo mensual; suele durar varios meses.']];var shop={month:today().slice(0,7),bought:{},items:lowItems,budgetVersion:'low-v4'};try{var sh=JSON.parse(localStorage.getItem(SHOP)||'{}');if(sh.bought)shop.bought=sh.bought;if(sh.month)shop.month=sh.month;if(sh.budgetVersion==='low-v4'&&Array.isArray(sh.items))shop.items=sh.items}catch(e){}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function saveCare(){localStorage.setItem(CARE,JSON.stringify(care))}function saveShop(){localStorage.setItem(SHOP,JSON.stringify(shop))}function saveProfile(){localStorage.setItem(PROFILE,JSON.stringify(profile))}saveShop();function records(t){return state.records.filter(function(r){return r&&r.type===t}).sort(function(a,b){return String(a.date||'').localeCompare(String(b.date||''))})}function latest(t){var a=records(t);return a.length?a[a.length-1]:null}function addRecord(t,d,dt){state.records.push({id:'r'+Date.now()+Math.random(),type:t,date:dt||today(),data:d||{},created:Date.now()});save()}function toast(t){toastEl.textContent=t;toastEl.className='toast show';clearTimeout(toast.x);toast.x=setTimeout(function(){toastEl.className='toast'},1500)}function setNav(v){Array.prototype.forEach.call(nav.querySelectorAll('button'),function(b){b.className=b.getAttribute('data-view')===v?'on':''})}var ph='';try{ph=localStorage.getItem(PHOTO)||''}catch(e){}if(ph)document.getElementById('avatar').innerHTML='<img src="'+ph+'">';var monthMenus=[['Escarola + morera','Usa escarola como base y una parte de la morera.'],['Berros + zapallo','Berros con una porción pequeña de zapallo.'],['Endivia + escarola','Rotación sencilla de hojas compradas.'],['Escarola + hibisco','Usa hibisco solo si es de fuente segura.'],['Berros + morera','Segunda rotación de hojas.'],['Escarola + endivia','Mantén variedad sin abrir más productos.'],['Escarola + pequeña porción de papaya o fresa','Fruta en cantidad pequeña; el resto son hojas.']];function menuFor(s){return monthMenus[(date(s).getDay()+6)%7]}function tasks(s){var a=[['water','💧','08:00','Cambiar agua','Agua limpia y recipiente revisado'],['hab','🌡️','08:15','Revisar hábitat','Temperatura, humedad, UVB y estado general'],['meal','🥬','09:00','Comida principal',menuFor(s)[0]],['clean','🧹','18:30','Limpieza rápida','Retirar restos y suciedad visible']];if(date(s).getDay()===0)a.push(['health','❤️','10:00','Chequeo visual','Actividad, ojos, nariz, caparazón y heces']);return a}function k(s,id){return s+':'+id}function done(s,id){return !!care.done[k(s,id)]}function completion(s){var a=tasks(s),n=0;a.forEach(function(t){if(done(s,t[0]))n++});return Math.round(n/a.length*100)}function toggleTask(id){var kk=k(care.selected,id);if(care.done[kk])delete care.done[kk];else care.done[kk]=1;saveCare();render('care')}function totalShop(){return shop.items.reduce(function(sum,x){return sum+(+x[2]||0)*(+x[3]||0)},0)}function boughtTotal(){return shop.items.reduce(function(sum,x,i){return sum+(shop.bought[i]?(+x[2]||0)*(+x[3]||0):0)},0)}function numericSeries(key){return records('peso').filter(function(r){return r.data&&isFinite(+r.data[key])&&+r.data[key]>0}).map(function(r){return {date:r.date,value:+r.data[key]}})}function chartSvg(arr,suffix){if(arr.length<2)return '<p class="muted">Registra al menos 2 mediciones con fecha para ver la gráfica.</p>';var w=320,h=170,p=24,min=arr[0].value,max=arr[0].value;arr.forEach(function(x){if(x.value<min)min=x.value;if(x.value>max)max=x.value});if(max===min){max+=1;min=Math.max(0,min-1)}var start=date(arr[0].date).getTime(),end=date(arr[arr.length-1].date).getTime();if(end===start)end=start+86400000;var pts=arr.map(function(x){var px=p+(date(x.date).getTime()-start)/(end-start)*(w-p*2),py=h-p-(x.value-min)/(max-min)*(h-p*2);return [px,py]}),poly=pts.map(function(a){return a[0].toFixed(1)+','+a[1].toFixed(1)}).join(' '),dots=pts.map(function(a,i){return '<circle cx="'+a[0]+'" cy="'+a[1]+'" r="3.5" fill="#123a2d"><title>'+arr[i].value+' '+suffix+' · '+arr[i].date+'</title></circle>'}).join('');return '<svg viewBox="0 0 320 170" role="img"><line x1="24" y1="146" x2="296" y2="146" stroke="#d8d5cc"/><line x1="24" y1="24" x2="24" y2="146" stroke="#d8d5cc"/><polyline points="'+poly+'" fill="none" stroke="#285746" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>'+dots+'<text x="28" y="19" font-size="11" fill="#748079">'+max.toFixed(suffix==='g'?0:1)+' '+suffix+'</text><text x="28" y="163" font-size="11" fill="#748079">'+min.toFixed(suffix==='g'?0:1)+' '+suffix+'</text></svg>'}function monthlyRate(arr){if(arr.length<2)return null;var a=arr[0],b=arr[arr.length-1],months=(date(b.date)-date(a.date))/(86400000*30.44);if(months<=0)return null;return (b.value-a.value)/months}function project(arr,months){if(arr.length<2)return null;var rate=monthlyRate(arr),last=arr[arr.length-1].value;if(rate===null)return null;return Math.max(0,last+rate*months)}function home(){var w=latest('peso'),pend=tasks(today()).filter(function(t){return !done(today(),t[0])}).length;return '<section class="hero"><small>ASÍ ESTÁ TORTI HOY</small><h2>Todo lo importante, sin buscarlo.</h2><p>La comida diaria sale de la misma compra mínima del mes.</p><div class="hero-grid"><div class="hero-metric"><small>Último peso</small><b>'+(w&&w.data&&w.data.weight?esc(w.data.weight)+' g':'Pendiente')+'</b></div><div class="hero-metric"><small>Agenda</small><b>'+completion(today())+'%</b></div><div class="hero-metric"><small>Presupuesto</small><b>S/ '+totalShop().toFixed(0)+'</b></div></div></section><div class="section-title"><h2>Accesos rápidos</h2><span>'+state.records.length+' registros</span></div><div class="quick"><button data-jump="weight"><span>⚖️</span><b>Registrar peso</b><small>Peso y medidas</small></button><button data-jump="food"><span>🥬</span><b>Comida</b><small>Menú de las compras</small></button><button data-jump="care"><span>📅</span><b>Agenda</b><small>'+pend+' pendientes</small></button><button data-jump="shop"><span>🛒</span><b>Compras</b><small>Producto por producto</small></button></div>'}function weight(){var a=records('peso').slice(-8).reverse();return '<div class="section-title"><h2>Crecimiento</h2><span>peso y tamaño</span></div><section class="card"><h3>Nueva medición</h3><form id="wf" class="form"><div class="grid"><label>Peso (g)<input name="weight" type="number" required></label><label>Fecha<input name="date" type="date" value="'+today()+'"></label></div><div class="grid"><label>Largo caparazón (cm)<input name="length" type="number" step=".1"></label><label>Ancho (cm)<input name="width" type="number" step=".1"></label></div><button>Guardar</button></form></section><section class="card"><h3>Historial</h3>'+a.map(function(r){return '<div class="row"><div class="ico">⚖️</div><div class="grow"><b>'+esc((r.data||{}).weight||'—')+' g</b><small>'+fmt(r.date)+' · '+esc((r.data||{}).length||'—')+' cm largo · '+esc((r.data||{}).width||'—')+' cm ancho</small></div></div>'}).join('')+'</section>'}function food(){var a=records('comida').slice(-8).reverse(),m=menuFor(today());return '<div class="section-title"><h2>Nutrición</h2><span>basada en compras del mes</span></div><section class="meal-card"><div class="meal-top"><div class="ico">🥬</div><div class="grow"><small class="muted">MENÚ DE HOY</small><h3>'+esc(m[0])+'</h3><div class="muted">'+esc(m[1])+'</div></div></div></section><section class="card"><form id="ff" class="form"><label>Alimento<input name="food" value="'+esc(m[0])+'" required></label><div class="grid"><label>Apetito<select name="appetite"><option>Bueno</option><option>Regular</option><option>Bajo</option><option>No comió</option></select></label><label>Fecha<input name="date" type="date" value="'+today()+'"></label></div><button>Guardar comida</button></form></section><section class="card"><h3>Recientes</h3>'+a.map(function(r){return '<div class="row"><div class="ico">🥬</div><div class="grow"><b>'+esc((r.data||{}).food||'—')+'</b><small>'+fmt(r.date)+'</small></div></div>'}).join('')+'</section>'}function careView(){var d=date(care.selected),dow=(d.getDay()+6)%7;d.setDate(d.getDate()-dow);var days=[];for(var i=0;i<7;i++)days.push(addDays(iso(d),i));var all=tasks(care.selected),chores=[];all.forEach(function(t){if(t[0]!=='meal')chores.push(t)});var m=menuFor(care.selected),mealDone=done(care.selected,'meal');return '<div class="section-title"><h2>Agenda</h2><span>'+completion(care.selected)+'% listo</span></div><section class="card"><div class="calendar-strip">'+days.map(function(x){return '<button class="daybtn '+(x===care.selected?'on':'')+'" data-day="'+x+'"><small>'+['D','L','M','M','J','V','S'][date(x).getDay()]+'</small><b>'+date(x).getDate()+'</b></button>'}).join('')+'</div></section><div class="section-title"><h2>Comida</h2><span>'+fmt(care.selected)+'</span></div><section class="meal-card"><div class="meal-top"><div class="ico">🥬</div><div class="grow"><small class="muted">09:00 · DEL PRESUPUESTO MENSUAL</small><h3>'+esc(m[0])+'</h3><div class="muted">'+esc(m[1])+'</div></div></div><button class="'+(mealDone?'done':'')+'" data-task="meal">'+(mealDone?'✓ Comida hecha':'Marcar comida')+'</button></section><div class="section-title"><h2>Quehaceres</h2><span>sin comida</span></div><section class="card">'+chores.map(function(t){var is=done(care.selected,t[0]);return '<div class="task '+(is?'done':'')+'"><div class="ico">'+t[1]+'</div><div class="task-copy"><div class="task-title"><span class="task-time">'+t[2]+'</span><span class="task-name">'+esc(t[3])+'</span></div><span class="task-desc">'+esc(t[4])+'</span><button class="task-action" data-task="'+t[0]+'">'+(is?'✓ Hecho':'Marcar')+'</button></div></div>'}).join('')+'</section>'}function shopView(){var total=totalShop(),spent=boughtTotal(),left=Math.max(0,total-spent);return '<div class="section-title"><h2>Compras mínimas</h2><span>'+shop.month+'</span></div><section class="budget"><small>PRESUPUESTO MENSUAL</small><h2>S/ '+total.toFixed(2)+'</h2><div class="budget-grid"><div class="budget-box"><small>Comprado</small><b>S/ '+spent.toFixed(2)+'</b></div><div class="budget-box"><small>Falta</small><b>S/ '+left.toFixed(2)+'</b></div><div class="budget-box"><small>Semana</small><b>S/ '+(total/4.3).toFixed(2)+'</b></div></div></section><div class="saving"><b>🛒 Lista producto por producto</b><span class="muted">El menú semanal se arma solo con estos alimentos para que puedas dividir exactamente lo que compras durante el mes.</span></div><section class="card"><h3>Mercado</h3>'+shop.items.map(function(x,i){var subtotal=(+x[2]||0)*(+x[3]||0),is=!!shop.bought[i];return '<div class="shop-item"><div class="ico">'+x[0]+'</div><div class="shop-main"><b>'+esc(x[1])+'</b><small>'+esc(x[4])+'</small><small>'+x[2]+' × S/ '+(+x[3]).toFixed(2)+'</small><div class="shop-foot"><span class="shop-price">S/ '+subtotal.toFixed(2)+'</span><button class="buy-btn '+(is?'done':'')+'" data-buy="'+i+'">'+(is?'✓':'Comprar')+'</button></div></div></div>'}).join('')+'</section><section class="card"><h3>Ajustar precios</h3><form id="shopform" class="form"><label>Producto<select name="idx">'+shop.items.map(function(x,i){return '<option value="'+i+'">'+esc(x[1])+'</option>'}).join('')+'</select></label><div class="grid"><label>Cantidad/mes<input name="qty" type="number" min="0" step="1"></label><label>Precio unitario S/<input name="price" type="number" min="0" step=".1"></label></div><button>Actualizar</button></form><p class="muted">Los precios son referencias editables para mantener el presupuesto bajo.</p></section>'}function more(){var ws=numericSeries('weight'),ls=numericSeries('length'),lastW=ws.length?ws[ws.length-1].value:null,lastL=ls.length?ls[ls.length-1].value:null,p6w=project(ws,6),p12w=project(ws,12),p24w=project(ws,24),p6l=project(ls,6),p12l=project(ls,12),p24l=project(ls,24);function p(v,s){return v===null?'—':(s==='g'?Math.round(v):v.toFixed(1))+' '+s}return '<div class="section-title"><h2>Torti</h2><span>crecimiento y proyección</span></div><section class="card"><div class="row"><div class="ico">🐢</div><div class="grow"><b>Torti</b><small>Hembra · Chelonoidis denticulatus · edad aprox. '+profile.ageYears.toFixed(1)+' años</small></div></div><form id="ageform" class="form"><label>Edad aproximada (años)<input name="age" type="number" min="0" step=".1" value="'+profile.ageYears+'"></label><button>Actualizar edad</button></form></section><section class="card"><h3>Gráfico de peso</h3><div class="chart-wrap">'+chartSvg(ws.slice(-10),'g')+'<div class="chart-legend"><span>Historial real de Torti</span><span>'+(lastW!==null?Math.round(lastW)+' g':'sin datos')+'</span></div></div></section><section class="card"><h3>Gráfico de tamaño</h3><div class="chart-wrap">'+chartSvg(ls.slice(-10),'cm')+'<div class="chart-legend"><span>Largo de caparazón</span><span>'+(lastL!==null?lastL.toFixed(1)+' cm':'sin datos')+'</span></div></div></section><section class="card"><h3>Proyección personalizada</h3><p class="muted">Se calcula con la tendencia de las propias mediciones de Torti. No es un “peso ideal” de la especie.</p><div class="projection"><div class="metric"><small>A '+(profile.ageYears+.5).toFixed(1)+' años</small><b>'+p(p6w,'g')+'</b><small>'+p(p6l,'cm')+'</small></div><div class="metric"><small>A '+(profile.ageYears+1).toFixed(1)+' años</small><b>'+p(p12w,'g')+'</b><small>'+p(p12l,'cm')+'</small></div><div class="metric"><small>A '+(profile.ageYears+2).toFixed(1)+' años</small><b>'+p(p24w,'g')+'</b><small>'+p(p24l,'cm')+'</small></div></div><div class="note" style="margin-top:12px">Para que la proyección sea útil, registra peso y largo al menos 2 veces con fechas distintas. El crecimiento de esta especie puede variar bastante entre individuos; la app usa su tendencia personal y no reemplaza evaluación veterinaria.</div></section><section class="card"><h3>Referencia de tamaño adulto</h3><p class="muted">Como referencia general, fuentes zoológicas describen adultos de patas amarillas alrededor de 52–75 cm de longitud, pero el tamaño y peso final varían mucho. Úsalo como contexto, no como meta obligatoria.</p></section><section class="card"><button class="btn" id="backup">Exportar respaldo JSON</button></section>'}function bind(v){if(v==='home')main.querySelectorAll('[data-jump]').forEach(function(b){b.onclick=function(){render(this.getAttribute('data-jump'))}});if(v==='weight'){var wf=document.getElementById('wf');if(wf)wf.onsubmit=function(e){e.preventDefault();var f=new FormData(this);addRecord('peso',{weight:f.get('weight'),length:f.get('length'),width:f.get('width')},f.get('date'));toast('Medición guardada');render('weight')}}if(v==='food'){var ff=document.getElementById('ff');if(ff)ff.onsubmit=function(e){e.preventDefault();var f=new FormData(this);addRecord('comida',{food:f.get('food'),appetite:f.get('appetite')},f.get('date'));toast('Comida guardada');render('food')}}if(v==='care'){main.querySelectorAll('[data-day]').forEach(function(b){b.onclick=function(){care.selected=this.getAttribute('data-day');saveCare();render('care')}});main.querySelectorAll('[data-task]').forEach(function(b){b.onclick=function(){toggleTask(this.getAttribute('data-task'));toast('Agenda actualizada')}})}if(v==='shop'){main.querySelectorAll('[data-buy]').forEach(function(b){b.onclick=function(){var i=this.getAttribute('data-buy');shop.bought[i]=!shop.bought[i];saveShop();render('shop')}});var sf=document.getElementById('shopform');if(sf)sf.onsubmit=function(e){e.preventDefault();var f=new FormData(this),i=+f.get('idx');if(f.get('qty')!=='')shop.items[i][2]=+f.get('qty');if(f.get('price')!=='')shop.items[i][3]=+f.get('price');saveShop();toast('Presupuesto actualizado');render('shop')}}if(v==='more'){var af=document.getElementById('ageform');if(af)af.onsubmit=function(e){e.preventDefault();var f=new FormData(this);profile.ageYears=+f.get('age')||profile.ageYears;saveProfile();toast('Edad actualizada');render('more')};var b=document.getElementById('backup');if(b)b.onclick=function(){var blob=new Blob([JSON.stringify({state:state,care:care,shop:shop,profile:profile},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='torti-backup-'+today()+'.json';a.click()}}}function render(v){setNav(v);try{main.innerHTML=v==='home'?home():v==='weight'?weight():v==='food'?food():v==='care'?careView():v==='shop'?shopView():more();bind(v);scrollTo(0,0)}catch(err){main.innerHTML='<section class="card"><h3>Error</h3><p>'+esc(err.message||err)+'</p></section>'}}nav.onclick=function(e){var t=e.target;while(t&&t!==nav&&!t.getAttribute('data-view'))t=t.parentNode;if(t&&t.getAttribute)render(t.getAttribute('data-view'))};render('home')})();</script></body></html>
