ate(d.getDate()+n);return iso(d)}function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function get(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')||d}catch(e){return d}}function save(k,x){localStorage.setItem(k,JSON.stringify(x))}function toast(s){te.textContent=s;te.style.display='block';setTimeout(function(){te.style.display='none'},1500)}var state=get(K,{records:[]}),care=get(C,{selected:today(),done:{}}),profile=get(R,{});if(!Array.isArray(state.records))state.records=[];if(!care.done)care.done={};if(!profile.birthAt){var b=new Date();b.setFullYear(b.getFullYear()-3);profile.birthAt=b.toISOString()}profile.name=profile.name||'Torti';profile.sex=profile.sex||'Hembra';profile.species=profile.species||'Chelonoidis denticulatus (probable)';profile.notes=profile.notes||'';save(R,profile);var meals=get(M,{count:2,slots:[{time:'10:00',share:60},{time:'15:30',share:40}]});function normalizeMeals(){meals.count=Math.max(1,Math.min(4,+meals.count||2));while(meals.slots.length<meals.count)meals.slots.push({time:['10:00','15:30','17:30','18:30'][meals.slots.length]||'15:00',share:0});meals.slots=meals.slots.slice(0,meals.count);var sum=meals.slots.reduce(function(a,x){return a+(+x.share||0)},0);if(sum!==100){var q=Math.floor(100/meals.count),left=100;meals.slots.forEach(function(x,i){x.share=i===meals.count-1?left:q;left-=x.share})}save(M,meals)}normalizeMeals();document.getElementById('head').textContent=profile.name;var ph=localStorage.getItem(P)||'';if(ph)document.getElementById('avatar').innerHTML='<img src="'+ph+'">';function rec(t){return state.records.filter(function(r){return r&&r.type===t}).sort(function(a,b){return String(a.date).localeCompare(String(b.date))})}function latest(t){var a=rec(t);return a.length?a[a.length-1]:null}function addrec(t,data,date){state.records.push({id:'r'+Date.now()+Math.random(),type:t,date:date||today(),data:data});save(K,state)}function age(){var b=new Date(profile.birthAt),n=new Date(),y=n.getFullYear()-b.getFullYear(),x=new Date(b);x.setFullYear(b.getFullYear()+y);if(x>n){y--;x=new Date(b);x.setFullYear(b.getFullYear()+y)}var mo=(n.getFullYear()-x.getFullYear())*12+n.getMonth()-x.getMonth(),z=new Date(x);z.setMonth(x.getMonth()+mo);if(z>n){mo--;z=new Date(x);z.setMonth(x.getMonth()+mo)}var q=n-z;return y+' años · '+mo+' meses · '+Math.floor(q/86400000)+' días · '+Math.floor(q%86400000/3600000)+' horas'}var menus=[['Escarola + berros','Papaya pequeña'],['Romana + escarola','Zapallo'],['Berros + escarola','Champiñón cultivado pequeño'],['Escarola + berros','Papaya o mango pequeño'],['Romana + berros','Zapallo'],['Escarola + berros','Proteína segura solo en la semana indicada'],['Escarola + berros','Fresa pequeña']];function menu(s){return menus[(dt(s).getDay()+6)%7]}function portions(s){var m=menu(s);return meals.slots.map(function(sl,i){var food=i===0?m[0]:i===1?m[1]:'Parte de la mezcla vegetal del día';return{time:sl.time,share:sl.share,food:food}})}function tasks(s){var a=[['obs','👀','07:45','Observar estado general','Actividad, postura, respiración, ojos y nariz.'],['temp','🌡️','08:00','Temperatura','Revisar zona cálida y fresca; evitar sobrecalentamiento.'],['hum','💧','08:05','Humedad y ventilación','Referencia orientativa 75–80% con buena ventilación.'],['uvb','☀️','08:10','UVB / iluminación','Confirmar funcionamiento, sombra y refugio.'],['water','🥣','08:15','Agua limpia','Cambiar agua y lavar recipiente si está sucio.'],['sub','🌱','08:20','Sustrato y refugio','Revisar humedad, moho, seguridad y refugio.']];portions(s).forEach(function(p,i){a.push(['meal'+i,'🥗',p.time,'Comida '+(i+1)+' · '+p.share+'%','Servir '+p.food+'. La suma del día sigue siendo 100%, no comida extra.'])});a.push(['fec','🔎','17:30','Heces y orina','Retirar suciedad y observar cambios llamativos.'],['clean','🧹','18:00','Limpieza puntual','Retirar restos y sustrato contaminado.'],['night','🌙','20:00','Chequeo nocturno','Agua, refugio, temperatura segura y recinto cerrado.']);var d=dt(s);if(d.getDay()===0)a.push(['health','❤️','10:30','Chequeo corporal semanal','Piel, patas, caparazón, ojos, nariz y boca visible.'],['weight','⚖️','10:40','Peso semanal','Registrar tendencia en condiciones similares.']);if(d.getDay()===3)a.push(['enrich','🌿','16:30','Enriquecimiento','Favorecer exploración sin generar estrés.']);if(d.getDate()===1)a.push(['deep','🧽','17:00','Limpieza profunda mensual','Accesorios, sustrato, ventilación y seguridad.'],['uvbage','💡','17:15','Revisar antigüedad UVB','Seguir reemplazo indicado por fabricante.'],['photo','📷','17:25','Foto mensual','Foto comparable de caparazón y cuerpo.']);return a}function key(s,id){return s+':'+id}function done(s,id){return !!care.done[key(s,id)]}function completion(s){var a=tasks(s),n=0;a.forEach(function(x){if(done(s,x[0]))n++});return Math.round(n/a.length*100)}var products=[['🥬','Escarola',3,'Mercado Bellavista','Puestos de verduras/hortalizas','https://www.google.com/maps/search/?api=1&query=Mercado+Bellavista+Callao'],['🌿','Berros',2.5,'Mercado Bellavista','Puestos de verduras; disponibilidad puede variar','https://www.google.com/maps/search/?api=1&query=Mercado+Bellavista+Callao'],['🥬','Lechuga romana',3,'Mercado Bellavista','Puestos de verduras','https://www.google.com/maps/search/?api=1&query=Mercado+Bellavista+Callao'],['🎃','Zapallo macre',2.5,'Mercado Bellavista','Verduras; comprar porción pequeña','https://www.google.com/maps/search/?api=1&query=Mercado+Bellavista+Callao'],['🍈','Papaya',3,'Mercado Bellavista','Puestos de frutas','https://www.google.com/maps/search/?api=1&query=Mercado+Bellavista+Callao'],['🍓','Fresa',2,'Mercado Bellavista','Puestos de frutas; precio estacional','https://www.google.com/maps/search/?api=1&query=Mercado+Bellavista+Callao'],['🍄','Champiñón cultivado',4,'Mercado/supermercado','Preferir champiñón comestible identificado; nunca silvestre desconocido','https://www.google.com/maps/search/?api=1&query=supermercado+Bellavista+Callao'],['🌿','Morera / hibisco',0,'Vivero o fuente segura','Opcional; solo sin pesticidas. No asumir stock en el mercado','https://www.google.com/maps/search/?api=1&query=vivero+Bellavista+Callao'],['🪱','Invertebrado apropiado',5,'Tienda especializada','Ocasional; confirmar especie/fuente segura. No usar insectos capturados donde haya pesticidas','https://www.google.com/maps/search/?api=1&query=tienda+mascotas+reptiles+Callao'],['🧴','Calcio para reptiles',5,'Veterinaria/tienda especializada','El precio es solo reserva mensual, no precio del envase','https://www.google.com/maps/search/?api=1&query=veterinaria+Bellavista+Callao']];var shop=get(S,{bought:{},prices:{}});if(!shop.bought)shop.bought={};if(!shop.prices)shop.prices={};save(S,shop);function price(i){return shop.prices[i]!=null?+shop.prices[i]:products[i][2]}function total(){return products.reduce(function(a,x,i){return a+price(i)},0)}function home(){return'<section class="hero"><small>'+esc(profile.name.toUpperCase())+' HOY</small><h2>Rutina flexible y completa.</h2><p>'+meals.count+' comidas configuradas · la ración diaria se divide sin duplicarse.</p><div class="grid"><div><b>'+age().split(' · ')[0]+'</b><small> edad</small></div><div><b>'+completion(today())+'%</b><small> cuidados</small></div></div></section><div class="quick"><button data-j="food"><span>🥗</span><b>Comidas</b><small>Horarios y raciones</small></button><button data-j="care"><span>✓</span><b>Cuidados</b><small>Checklist completo</small></button><button data-j="shop"><span>🛒</span><b>Productos</b><small>Precio y dónde comprar</small></button><button data-j="more"><span>🐢</span><b>Perfil</b><small>Datos de '+esc(profile.name)+'</small></button></div>'}function food(){var ps=portions(today());return'<div class="title"><h2>Comidas</h2><span>'+meals.count+' al día</span></div><section class="meal"><small>RACIÓN TOTAL DEL DÍA = 100%</small>'+ps.map(function(p,i){return'<div class="meal-slot"><span class="share">'+p.share+'%</span><h3>'+p.time+' · Comida '+(i+1)+'</h3><div>'+esc(p.food)+'</div></div>'}).join('')+'<div class="print"><button data-print="day">Imprimir hoy</button><button data-print="week">Semana</button><button data-print="month">Mes</button></div></section><div class="card"><h3>Configurar horarios</h3><form id="mf" class="form"><label>Número de comidas<select name="count"><option>1</option><option'+(meals.count===2?' selected':'')+'>2</option><option'+(meals.count===3?' selected':'')+'>3</option><option'+(meals.count===4?' selected':'')+'>4</option></select></label>'+meals.slots.map(function(x,i){return'<div class="grid"><label>Hora '+(i+1)+'<input type="time" name="t'+i+'" value="'+x.time+'"></label><label>% de ración<input type="number" min="1" max="100" name="s'+i+'" value="'+x.share+'"></label></div>'}).join('')+'<button>Guardar horarios</button></form><div class="muted" style="margin-top:9px">Dos comidas no significan el doble de alimento: la app divide la misma ración diaria. Como Torti necesita calentarse y activarse antes de digerir bien, una primera comida a media mañana suele tener más sentido que esperar obligatoriamente hasta el mediodía.</div></div>'}function careView(){var d=dt(care.selected),dow=(d.getDay()+6)%7;d.setDate(d.getDate()-dow);var ds=[],i;for(i=0;i<7;i++)ds.push(add(iso(d),i));return'<div class="title"><h2>Cuidados</h2><span>'+completion(care.selected)+'%</span></div><section class="card"><div class="days">'+ds.map(function(x){return'<button class="day '+(x===care.selected?'on':'')+'" data-day="'+x+'">'+dt(x).getDate()+'</button>'}).join('')+'</div></section><section class="card">'+tasks(care.selected).map(function(t){var ok=done(care.selected,t[0]);return'<div class="task '+(ok?'done':'')+'"><div class="ico">'+t[1]+'</div><div><b>'+t[2]+' · '+esc(t[3])+'</b><small>'+esc(t[4])+'</small><button data-task="'+t[0]+'">'+(ok?'✓ Hecho':'Marcar')+'</button></div></div>'}).join('')+'</section>'}function shopView(){return'<div class="title"><h2>Productos</h2><span>Bellavista</span></div><section class="budget"><small>REFERENCIA EDITABLE</small><h2>S/ '+total().toFixed(2)+'</h2><p>Precios aproximados, confirma en el puesto.</p></section><section class="card">'+products.map(function(x,i){var open=shop.open===i;return'<div class="shop"><button class="pic" data-info="'+i+'">'+x[0]+'</button><div><b>'+esc(x[1])+'</b><small>Referencia: S/ '+price(i).toFixed(2)+'</small><button class="info" data-info="'+i+'">'+(open?'Ocultar info':'Ver información')+'</button>'+(open?'<div class="infoBox"><b>Precio referencial:</b> S/ '+price(i).toFixed(2)+'<br><b>Dónde:</b> '+esc(x[3])+'<br>'+esc(x[4])+'<br><a href="'+x[5]+'" target="_blank" rel="noopener">Abrir ubicación/búsqueda ↗</a><label style="display:block;margin-top:8px">Actualizar precio S/<input data-price="'+i+'" type="number" step=".1" min="0" value="'+price(i)+'" style="width:100%;padding:9px;border:1px solid #ddd;border-radius:9px"></label></div>':'')+'</div></div>'}).join('')+'</section><div class="muted">Mercado Bellavista está en el entorno de Av. Venezuela / Av. Elmer Faucett. La disponibilidad exacta y precios cambian por día; morera, hibisco e insumos especializados pueden requerir vivero o tienda especializada.</div>'}function weight(){var a=rec('peso').slice(-8).reverse();return'<div class="title"><h2>Crecimiento</h2></div><section class="card"><form id="wf" class="form"><div class="grid"><label>Peso g<input name="weight" type="number" required></label><label>Fecha<input name="date" type="date" value="'+today()+'"></label></div><div class="grid"><label>Largo cm<input name="length" type="number" step=".1"></label><label>Ancho cm<input name="width" type="number" step=".1"></label></div><button>Guardar</button></form></section><section class="card">'+(a.length?a.map(function(r){return'<div class="row"><b>'+esc(r.data.weight)+' g</b><div class="muted">'+esc(r.date)+' · '+esc(r.data.length||'—')+' cm</div></div>'}).join(''):'<div class="muted">Sin mediciones todavía.</div>')+'</section>'}function more(){return'<div class="title"><h2>'+esc(profile.name)+'</h2></div><section class="card"><b>'+esc(profile.sex)+' · '+esc(profile.species)+'</b><div class="age"><small>EDAD AUTOMÁTICA</small><strong id="live">'+age()+'</strong></div><button class="primary" style="margin-top:12px" data-j="settings">Configurar datos</button></section>'}function settings(){var d=new Date(profile.birthAt),v=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());return'<div class="title"><h2>Configuración</h2></div><section class="card"><form id="pf" class="form"><label>Nombre<input name="name" value="'+esc(profile.name)+'"></label><label>Sexo<select name="sex"><option'+(profile.sex==='Hembra'?' selected':'')+'>Hembra</option><option'+(profile.sex==='Macho'?' selected':'')+'>Macho</option><option>Desconocido</option></select></label><label>Especie<input name="species" value="'+esc(profile.species)+'"></label><label>Nacimiento estimado<input type="datetime-local" name="birth" value="'+v+'"></label><label>Notas<textarea name="notes">'+esc(profile.notes)+'</textarea></label><button>Guardar</button></form></section>'}function printMenu(range){var ds=[],n=today(),d,i,title;if(range==='day'){ds=[n];title='Menú diario'}else if(range==='week'){d=dt(n);d.setDate(d.getDate()-((d.getDay()+6)%7));for(i=0;i<7;i++)ds.push(add(iso(d),i));title='Menú semanal'}else{d=dt(n);for(i=1;i<=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();i++)ds.push(d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(i));title='Menú mensual'}var rows='';ds.forEach(function(s){portions(s).forEach(function(p,i){rows+='<tr><td>'+s+'</td><td>'+p.time+'</td><td>'+p.share+'%</td><td>'+esc(p.food)+'</td></tr>'})});var w=window.open('','_blank');if(!w)return toast('Permite ventanas emergentes');w.document.write('<meta charset="utf-8"><style>body{font-family:Arial;padding:20px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #ccc;padding:8px}</style><h1>'+title+' · '+esc(profile.name)+'</h1><p>La suma de las comidas del día representa el 100% de la ración diaria.</p><table><tr><th>Fecha</th><th>Hora</th><th>Ración</th><th>Alimento</th></tr>'+rows+'</table><script>setTimeout(function(){print()},250)<\/script>');w.document.close()}function bind(v){Array.prototype.forEach.call(main.querySelectorAll('[data-j]'),function(b){b.onclick=function(){render(this.getAttribute('data-j'))}});Array.prototype.forEach.call(main.querySelectorAll('[data-day]'),function(b){b.onclick=function(){care.selected=this.getAttribute('data-day');save(C,care);render('care')}});Array.prototype.forEach.call(main.querySelectorAll('[data-task]'),function(b){b.onclick=function(){var z=key(care.selected,this.getAttribute('data-task'));care.done[z]=!care.done[z];save(C,care);render('care')}});Array.prototype.forEach.call(main.querySelectorAll('[data-info]'),function(b){b.onclick=function(){var i=+this.getAttribute('data-info');shop.open=shop.open===i?null:i;save(S,shop);render('shop')}});Array.prototype.forEach.call(main.querySelectorAll('[data-price]'),function(inp){inp.onchange=function(){shop.prices[+this.getAttribute('data-price')]=+this.value;save(S,shop);render('shop')}});Array.prototype.forEach.call(main.querySelectorAll('[data-print]'),function(b){b.onclick=function(){printMenu(this.getAttribute('data-print'))}});var f;if(v==='food'&&(f=document.getElementById('mf')))f.onsubmit=function(e){e.preventDefault();var d=new FormData(this),c=+d.get('count');meals.count=c;meals.slots=[];for(var i=0;i<c;i++)meals.slots.push({time:d.get('t'+i)||['10:00','15:30','17:30','18:30'][i],share:+d.get('s'+i)||0});normalizeMeals();toast('Horarios guardados');render('food')};if(v==='weight'&&(f=document.getElementById('wf')))f.onsubmit=function(e){e.preventDefault();var d=new FormData(this);addrec('peso',{weight:d.get('weight'),length:d.get('length'),width:d.get('width')},d.get('date'));toast('Medición guardada');render('weight')};if(v==='settings'&&(f=document.getElementById('pf')))f.onsubmit=function(e){e.preventDefault();var d=new FormData(this);profile.name=d.get('name')||'Torti';profile.sex=d.get('sex');profile.species=d.get('species');profile.birthAt=new Date(d.get('birth')).toISOString();profile.notes=d.get('notes');save(R,profile);document.getElementById('head').textContent=profile.name;toast('Datos guardados');render('more')}}function render(v){Array.prototype.forEach.call(nav.querySelectorAll('button'),function(b){b.className=(b.getAttribute('data-v')===v||(v==='settings'&&b.getAttribute('data-v')==='more'))?'on':''});main.innerHTML=v==='home'?home():v==='food'?food():v==='care'?careView():v==='shop'?shopView():v==='weight'?weight():v==='settings'?settings():more();bind(v);scrollTo(0,0)}nav.onclick=function(e){var t=e.target;while(t&&t!==nav&&!t.getAttribute('data-v'))t=t.parentNode;if(t&&t.getAttribute)render(t.getAttribute('data-v'))};render('home')})();</script></body></html>
