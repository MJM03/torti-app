ction pad(n){return n<10?'0'+n:n}function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}function dt(s){var p=String(s).split('-');return new Date(+p[0],+p[1]-1,+p[2],12)}function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}function add(s,n){var d=dt(s);d.setDate(d.getDate()+n);return iso(d)}function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function get(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')||d}catch(e){return d}}function save(k,x){localStorage.setItem(k,JSON.stringify(x))}var state=get(K,{records:[]});if(!Array.isArray(state.records))state.records=[];var care=get(C,{selected:today(),done:{}});if(!care.done)care.done={};var profile=get(R,{});if(!profile.birthAt){var b=new Date();b.setFullYear(b.getFullYear()-3);profile.birthAt=b.toISOString()}profile.name=profile.name||'Torti';profile.sex=profile.sex||'Hembra';profile.species=profile.species||'Chelonoidis denticulatus (probable)';profile.arrivalDate=profile.arrivalDate||'';profile.notes=profile.notes||'';save(R,profile);document.getElementById('head').textContent=profile.name;var photo=localStorage.getItem(P)||'';if(photo)document.getElementById('avatar').innerHTML='<img src="'+photo+'">';function age(){var b=new Date(profile.birthAt),n=new Date(),y=n.getFullYear()-b.getFullYear(),x=new Date(b);x.setFullYear(b.getFullYear()+y);if(x>n){y--;x=new Date(b);x.setFullYear(b.getFullYear()+y)}var m=(n.getFullYear()-x.getFullYear())*12+n.getMonth()-x.getMonth(),z=new Date(x);z.setMonth(x.getMonth()+m);if(z>n){m--;z=new Date(x);z.setMonth(x.getMonth()+m)}var q=Math.max(0,n-z),d=Math.floor(q/86400000),h=Math.floor(q%86400000/3600000);return y+' años · '+m+' meses · '+d+' días · '+h+' horas'}function rec(t){return state.records.filter(function(r){return r&&r.type===t}).sort(function(a,b){return String(a.date).localeCompare(String(b.date))})}function latest(t){var a=rec(t);return a.length?a[a.length-1]:null}function addrec(t,data,date){state.records.push({id:'r'+Date.now()+Math.random(),type:t,date:date||today(),data:data});save(K,state)}function toast(s){te.textContent=s;te.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){te.style.display='none'},1400)}/* Menú práctico: variedad vegetal diaria; fruta moderada; hongos y proteína ocasionales. No pretende fijar porcentajes clínicos. */var menus=[['Escarola + berros + un poco de papaya','Base de hojas variadas con fruta tropical en porción moderada.'],['Romana + escarola + zapallo','Día principalmente vegetal; romana solo dentro de una mezcla.'],['Berros + escarola + champiñón cultivado','Añade una pequeña porción de hongo comestible de supermercado.'],['Escarola + berros + un poco de mango o papaya','Variedad vegetal con fruta moderada.'],['Romana + berros + zapallo','Día vegetal, alternando ingredientes.'],['Escarola + berros + proteína ocasional','Cada 2 semanas: pequeña porción de lombriz/invertebrado apropiado de fuente segura; las demás semanas reemplaza por hojas.'],['Escarola + berros + fresa pequeña','Fruta como parte de la variedad, sin convertirla en toda la ración.']];function menu(s){return menus[(dt(s).getDay()+6)%7]}function isProteinWeek(s){var d=dt(s),one=new Date(d.getFullYear(),0,1),wk=Math.floor((d-one)/604800000);return wk%2===0}function mealText(s){var m=menu(s);if((dt(s).getDay()+6)%7===5&&!isProteinWeek(s))return['Escarola + berros + zapallo','Semana sin proteína: mantén la ración vegetal variada.'];return m}/* Rutina integral: diario + tareas periódicas */function tasks(s){var d=dt(s),dow=d.getDay(),day=d.getDate(),a=[['observe','👀','07:45','Observar antes de manipular','Actividad, postura, respiración, ojos y nariz; detectar cambios temprano.'],['temp','🌡️','08:00','Temperatura','Comprueba gradiente térmico y que no haya sobrecalentamiento.'],['humid','💧','08:02','Humedad','Objetivo orientativo para patas amarillas: 75–80%; mantener también ventilación.'],['uvb','☀️','08:05','UVB / iluminación','Confirma que la luz funciona, sin vidrio bloqueando UVB, y que tenga sombra/refugio.'],['water','🥣','08:10','Agua limpia','Cambiar agua; lavar el recipiente si está sucio o tiene heces.'],['substrate','🌱','08:15','Sustrato y refugio','Revisar humedad del sustrato, zonas secas/encharcadas, moho, objetos peligrosos y refugio accesible.'],['meal','🥗','09:00','Preparar comida','Lavar alimentos, retirar partes dañadas y servir la mezcla del día.'],['appetite','🍽️','10:00','Revisar apetito','Confirmar que comió y retirar alimento que empiece a deteriorarse.'],['feces','🔎','12:00','Heces y orina','Si defecó, revisar cambios llamativos y retirar de inmediato.'],['clean','🧹','18:00','Limpieza puntual','Retirar restos de comida, heces y sustrato muy sucio.'],['night','🌙','20:00','Chequeo nocturno','Confirmar temperatura segura, refugio, agua y que no pueda escapar o lesionarse.']];if(dow===0)a.push(['health','❤️','10:30','Chequeo corporal semanal','Ojos, nariz, boca visible, piel, patas, uñas, caparazón/plastrón y simetría. No arrancar escamas.']);if(dow===0)a.push(['weight','⚖️','10:40','Peso semanal','Pesar en condiciones parecidas y registrar tendencia; el crecimiento importa más que un número aislado.']);if(dow===3)a.push(['enrich','🌿','16:00','Enriquecimiento','Cambiar ligeramente zonas de exploración/refugio o distribuir alimento para fomentar movimiento, sin estrés.']);if(day===1)a.push(['deep','🧽','17:00','Limpieza profunda mensual','Lavar accesorios, revisar sustrato completo, ventilación, seguridad y estado del recinto.']);if(day===1)a.push(['uvbage','💡','17:15','Revisar antigüedad UVB','Anotar fecha/estado de la lámpara y seguir el intervalo de reemplazo del fabricante; la emisión UV disminuye con el uso.']);if(day===1)a.push(['shellphoto','📷','17:25','Foto mensual de caparazón','Misma posición e iluminación para comparar cambios reales.']);return a}function key(s,id){return s+':'+id}function done(s,id){return !!care.done[key(s,id)]}function completion(s){var a=tasks(s),n=0;a.forEach(function(x){if(done(s,x[0]))n++});return Math.round(n/a.length*100)}var pics={'Escarola':'https://walmarthn.vtexassets.com/arquivos/ids/361758/Escarola-Hortifruti-Amarilla-Unidad-1-10091.jpg','Berros':'https://siembrapanama.com/wp-content/uploads/2025/09/Berro.jpg','Lechuga romana':'https://clubreeco.com.mx/img/product/1_83_541-343_reeco_producto1_288_41.webp','Zapallo macre':'https://static.wixstatic.com/media/cba1e2_d6c4ed10e8f34953ab4cf7643c71710d~mv2.png','Papaya':'https://commons.wikimedia.org/wiki/Special:FilePath/Papaya_fruit.JPG?width=300','Fresa':'https://commons.wikimedia.org/wiki/Special:FilePath/Strawberry-fruit.JPG?width=300','Champiñón cultivado':'https://commons.wikimedia.org/wiki/Special:FilePath/ChampignonMushroom.jpg?width=300'};var base=[['🥬','Escarola',4,3,'Base','Hojas para rotar durante el mes.'],['🌿','Berros',4,2.5,'Base','Atados pequeños para mezclar con otras hojas.'],['🥬','Lechuga romana',2,3,'Rotación','Úsala mezclada, no como dieta única.'],['🎃','Zapallo macre',2,2.5,'Rotación','Porciones pequeñas.'],['🍈','Papaya',2,3,'Fruta','Porciones moderadas dentro de la mezcla.'],['🍓','Fresa',1,2,'Fruta','Pequeña cantidad para variedad.'],['🍄','Champiñón cultivado',1,4,'Ocasional','Hongo comestible de supermercado; porción pequeña.'],['🪱','Proteína/invertebrado seguro',1,5,'Ocasional','Aproximadamente cada 2 semanas; fuente segura. No carne procesada.'],['🧴','Reserva calcio',1,5,'Reserva','Usar según producto y recomendación veterinaria.'],['🌱','Reserva sustrato',1,8,'Reserva','Reposición cuando sea necesario.'],['☀️','Reserva UVB',1,8,'Reserva','Fondo para reemplazo según fabricante.'],['🧽','Cepillo exclusivo',1,4,'Higiene','Solo para sus recipientes/accesorios.']];var shop=get(S,{});if(shop.budgetVersion!=='care-v48'){shop={month:today().slice(0,7),bought:{},items:base,budgetVersion:'care-v48'};save(S,shop)}function total(){return shop.items.reduce(function(a,x){return a+(+x[2]||0)*(+x[3]||0)},0)}function current(k){var r=latest('peso');return r&&r.data&&+r.data[k]>0?+r.data[k]:null}function home(){return'<section class="hero"><small>'+esc(profile.name.toUpperCase())+' HOY</small><h2>Cuidado total, sin olvidos.</h2><p>Alimentación variada, ambiente tropical, higiene, salud y seguimiento.</p><div class="metrics"><div class="metric"><small>Edad</small><b>'+age().split(' · ')[0]+'</b></div><div class="metric"><small>Cuidados hoy</small><b>'+completion(today())+'%</b></div><div class="metric"><small>Mercado</small><b>S/ '+total().toFixed(0)+'</b></div></div></section><div class="quick"><button data-j="care"><span>✓</span><b>Cuidados de hoy</b><small>Checklist completo</small></button><button data-j="food"><span>🥗</span><b>Menú</b><small>Diario/semanal/mensual</small></button><button data-j="weight"><span>⚖️</span><b>Crecimiento</b><small>Peso y tamaño</small></button><button data-j="settings"><span>⚙️</span><b>Configuración</b><small>Datos de '+esc(profile.name)+'</small></button></div>'}function food(){var m=mealText(today());return'<div class="title"><h2>Alimentación</h2><span>1 servicio diario</span></div><section class="meal"><small>MENÚ DE HOY · 09:00</small><h3>'+esc(m[0])+'</h3><p>'+esc(m[1])+'</p><div><span class="badge">🥬 variedad vegetal</span><span class="badge">🍈 fruta moderada</span><span class="badge">🍄 hongos</span><span class="badge">🪱 proteína ocasional</span></div><div class="print"><button data-print="day">Imprimir hoy</button><button data-print="week">Imprimir semana</button><button data-print="month">Imprimir mes</button></div></section><div class="note">La patas amarillas es omnívora y en campo consume frutos, hojas, flores, hongos e invertebrados. Este menú es una guía doméstica conservadora, no una prescripción veterinaria ni una fórmula rígida de porcentajes.</div><section class="card"><form id="ff" class="form"><label>Qué comió<input name="food" value="'+esc(m[0])+'"></la ;var y=d.getFullYear(),m=d.getMonth(),last=new Date(y,m+1,0).getDate();for(i=1;i<=last;i++)dates.push(y+'-'+pad(m+1)+'-'+pad(i));title='Menú mensual'}var rows=dates.map(function(s){var mm=mealText(s);return'<tr><td>'+s+'</td><td><b>'+esc(mm[0])+'</b><br><small>'+esc(mm[1])+'</small></td><td>09:00</td></tr>'}).join(''),w=window.open('','_blank');if(!w){toast('Permite ventanas emergentes');return}w.document.write('<!doctype html><meta charset="utf-8"><title>'+title+'</title><style>body{font-family:Arial;padding:24px;color:#183129}table{width:100%;border-collapse:collapse}td,th{border:1px solid #ccc;padding:9px;text-align:left}th{background:#edf4ef}</style><h1>'+title+' de '+esc(profile.name)+'</h1><p>Guía de alimentación de Torti · variedad vegetal diaria, fruta moderada, hongos y proteína ocasional.</p><table><tr><th>Fecha</th><th>Menú</th><th>Hora</th></tr>'+rows+'</table><script>setTimeout(function(){print()},250)<\/script>');w.document.close()}function bind(v){Array.prototype.forEach.call(main.querySelectorAll('[data-j]'),function(b){b.onclick=function(){render(this.getAttribute('data-j'))}});Array.prototype.forEach.call(main.querySelectorAll('[data-day]'),function(b){b.onclick=function(){care.selected=this.getAttribute('data-day');save(C,care);render('care')}});Array.prototype.forEach.call(main.querySelectorAll('[data-task]'),function(b){b.onclick=function(){var z=key(care.selected,this.getAttribute('data-task'));care.done[z]=!care.done[z];save(C,care);render('care')}});Array.prototype.forEach.call(main.querySelectorAll('[data-print]'),function(b){b.onclick=function(){printMenu(this.getAttribute('data-print'))}});Array.prototype.forEach.call(main.querySelectorAll('[data-buy]'),function(b){b.onclick=function(){var i=this.getAttribute('data-buy');shop.bought[i]=!shop.bought[i];save(S,shop);render('shop')}});Array.prototype.forEach.call(main.querySelectorAll('[data-img]'),function(b){b.onclick=function(){var x=shop.items[+this.getAttribute('data-img')],p=pics[x[1]];
