<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17392b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Torti">
<title>Torti — Mi tortuga · V4 Safe</title>
<style>html,body{margin:0;min-height:100%;background:#f5f2ea}#boot{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;color:#173028;padding:24px;text-align:center}#boot div{max-width:360px}#boot b{display:block;font-size:28px;margin:10px 0}#boot small{color:#6f7b75;line-height:1.5}.boot-dot{font-size:46px}</style>
</head>
<body>
<div id="boot"><div><div class="boot-dot">🐢</div><b>Recuperando Torti</b><small>Cargando una versión segura para restaurar la app sin tocar tus datos…</small></div></div>
<script>
(function(){
  try{
    if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister()})})}
    if('caches' in window){caches.keys().then(function(ks){ks.forEach(function(k){caches.delete(k)})})}
  }catch(e){}
  var s=document.createElement('script');
  s.src='v4-safe.js?v=4.0.3';
  s.onload=function(){var b=document.getElementById('boot');if(b)b.remove()};
  s.onerror=function(){var b=document.getElementById('boot');if(b)b.innerHTML='<div><div class="boot-dot">🐢</div><b>Error de carga</b><small>Abre esta página en Safari y recarga una vez.</small></div>'};
  document.body.appendChild(s);
})();
</script>
</body>
</html>
