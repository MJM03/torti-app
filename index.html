<html lang="es">
<head>

<meta name="theme-color" content="#0f2f24">
<title>Torti — Mi tortuga</title>
<style>
:root{--bg:#f3f0e7;--card:#fffdf8;--ink:#183129;--muted:#748079;--line:#e7e2d7;--green:#123a2d;--green2:#285746;--soft:#edf4ef;--sand:#f1e1bd;--warm:#9e692d;--red:#9a4b44;--shadow:0 14px 35px rgba(24,49,41,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}body{min-height:100vh}.app{max-width:760px;margin:auto;padding:0 14px 112px}.top{display:flex;justify-content:space-between;align-items:center;padding:calc(18px + env(safe-area-inset-top)) 4px 12px}.brand small{display:block;color:var(--muted);font-weight:900;letter-spacing:.11em;font-size:11px}.brand h1{font-size:34px;line-height:1;margin:5px 0 3px}.brand p{margin:0;color:var(--muted);font-size:13px}.avatar{width:58px;height:58px;border-radius:21px;background:linear-gradient(145deg,#224d3d,#0d2d23);display:grid;place-items:center;color:white;font-size:30px;overflow:hidden;box-shadow:var(--shadow)}.avatar img{width:100%;height:100%;object-fit:cover}.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#173f31,#0e2e24);color:#fff;border-radius:30px;padding:22px;margin:5px 0 14px;min-height:190px;box-shadow:0 18px 38px rgba(15,47,36,.18)}.hero:after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.07);right:-70px;top:-80px}.hero .eyebrow{font-size:11px;font-weight:900;letter-spacing:.12em;opacity:.75}.hero h2{font-size:28px;margin:10px 0 6px;max-width:420px}.hero p{margin:0;opacity:.8;max-width:470px;line-height:1.45}.hero-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px;position:relative;z-index:1}.hero-metric{background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.12);border-radius:17px;padding:11px;backdrop-filter:blur(12px)}.hero-metric small,.hero-metric b{display:block}.hero-metric small{font-size:10px;opacity:.68}.hero-metric b{font-size:17px;margin-top:3px}.section-title{display:flex;align-items:end;justify-content:space-between;margin:18px 4px 9px}.section-title h2{font-size:21px;margin:0}.section-title span{font-size:12px;color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:17px;margin:10px 0;box-shadow:0 8px 24px rgba(30,47,41,.035)}.card h2,.card h3{margin:0 0 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick button{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:15px;text-align:left;color:var(--ink);min-height:88px;box-shadow:0 6px 20px rgba(20,40,32,.035)}.quick button span{font-size:25px;display:block;margin-bottom:8px}.quick button b{display:block;font-size:14px}.quick button small{display:block;color:var(--muted);margin-top:3px}.metric{background:var(--soft);padding:13px;border-radius:18px}.metric small,.metric b{display:block}.metric small{color:var(--muted);font-size:11px}.metric b{font-size:21px;margin-top:4px}.muted{color:var(--muted);font-size:13px;line-height:1.45}.notice{background:var(--soft);border-radius:16px;padding:12px;font-weight:700}.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;background:var(--soft);font-size:11px;font-weight:800}.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}.row .ico{width:38px;height:38px;border-radius:13px;background:var(--soft);display:grid;place-items:center;font-size:19px;flex:0 0 auto}.row .grow{min-width:0;flex:1}.row b,.row small{display:block}.row small{color:var(--muted);font-size:12px;margin-top:3px}.row .value{font-weight:800;font-size:13px}.form label{display:block;font-size:13px;font-weight:800;margin:12px 0}.form input,.form select,.form textarea{width:100%;font-size:16px;padding:13px;border:1px solid var(--line);border-radius:14px;background:white;color:var(--ink);outline:none}.form input:focus,.form select:focus,.form textarea:focus{border-color:#78998b;box-shadow:0 0 0 3px rgba(40,87,70,.10)}.form button,.btn{width:100%;border:0;border-radius:15px;padding:14px;background:var(--green);color:white;font-weight:850;font-size:14px}.btn.secondary{background:var(--soft);color:var(--green)}.seg{display:grid;grid-template-columns:repeat(3,1fr);background:#eae7de;padding:4px;border-radius:15px;margin-bottom:12px}.seg button{border:0;background:transparent;border-radius:11px;padding:9px 6px;font-weight:800;color:var(--muted)}.seg button.on{background:white;color:var(--ink);box-shadow:0 3px 12px rgba(0,0,0,.06)}.task{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.task:first-child{border-top:0}.task .ico{width:40px;height:40px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:20px}.task b,.task small{display:block}.task small{color:var(--muted);font-size:12px;margin-top:3px}.task button{border:0;background:var(--soft);color:var(--green);font-weight:900;border-radius:12px;padding:9px 11px}.task.done{opacity:.58}.task.done b{text-decoration:line-through}.task.done button{background:var(--green);color:white}.calendar-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.daybtn{border:1px solid var(--line);background:white;border-radius:15px;padding:9px 2px;text-align:center;color:var(--ink)}.daybtn small,.daybtn b{display:block}.daybtn small{font-size:9px;color:var(--muted);text-transform:uppercase}.daybtn b{font-size:15px;margin:3px 0}.daybtn em{font-style:normal;font-size:10px;color:var(--green)}.daybtn.on{background:var(--green);color:white;border-color:var(--green)}.daybtn.on small,.daybtn.on em{color:#dfece5}.chart{height:160px;display:flex;align-items:end;gap:7px;padding:12px 4px 2px}.bar{flex:1;min-width:8px;background:linear-gradient(#678d7d,#214d3d);border-radius:10px 10px 4px 4px;position:relative}.bar span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:9px;color:var(--muted);padding-bottom:3px;white-space:nowrap}.food-suggest{background:linear-gradient(135deg,#f4ecd9,#eee0be);border-radius:20px;padding:16px}.food-suggest small{color:#876b42}.food-suggest h3{margin:6px 0}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(760px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,253,248,.94);border-top:1px solid var(--line);padding:7px 5px calc(7px + env(safe-area-inset-bottom));z-index:20;backdrop-filter:blur(20px)}.nav button{border:0;background:none;min-height:58px;color:#7b867f;font-weight:750;font-size:10px;border-radius:15px}.nav button i{display:block;font-style:normal;font-size:21px;margin-bottom:2px}.nav button.on{color:var(--green);background:#edf4ef}.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,20px);background:#17392b;color:white;padding:11px 15px;border-radius:999px;font-size:12px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;z-index:30}.toast.show{opacity:1;transform:translate(-50%,0)}.error{background:#fbe8e5;color:#7d332f;padding:12px;border-radius:14px;white-space:pre-wrap}@media(max-width:420px){.hero-grid{grid-template-columns:1fr 1fr}.hero-metric:last-child{grid-column:1/-1}.grid,.quick{grid-template-columns:1fr 1fr}.app{padding-left:10px;padding-right:10px}.hero{border-radius:26px;padding:19px}.task{grid-template-columns:40px 1fr auto}.task button{padding:8px 9px;font-size:11px}}
</style>
</head>
<body>
<div class="app" id="app">
<header class="top"><div class="brand"><small>TORTI · V4 STABLE</small><h1>Torti</h1><p>Mi tortuga · seguimiento diario</p></div><div class="avatar" id="avatar">🐢</div></header>
<main id="main"><section class="card"><h2>Cargando Torti…</h2><p class="muted">Preparando tus registros.</p></section></main>
</div>
<nav class="nav" id="nav">
<button data-view="home" class="on"><i>⌂</i>Inicio</button>
<button data-view="weight"><i>↗</i>Crece</button>
<button data-view="food"><i>🥬</i>Comida</button>
<button data-view="care"><i>📅</i>Agenda</button>
<button data-view="more"><i>🐢</i>Torti</button>
</nav>
<div class="toast" id="toast"></div>
<script>
(function(){
'use strict';
var KEY='torti-v1-data',PHOTO='torti-v1-photo',CARE='torti-v4-stable-care';
var main=document.getElementById('main'),nav=document.getElementById('nav'),toastEl=document.getElementById('toast');
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return n<10?'0'+n:String(n)}
function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function date(s){var p=String(s).split('-');return new Date(+p[0],+p[1]-1,+p[2],12,0,0)}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function addDays(s,n){var d=date(s);d.setDate(d.getDate()+n);return iso(d)}
function dayName(s){return ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'][date(s).getDay()]}
function fmt(s){try{return new Intl.DateTimeFormat('es-PE',{day:'numeric',month:'short'}).format(date(s))}catch(e){return s}}
function load(){var x={records:[],tasks:[],checks:{},routines:[]};try{var raw=localStorage.getItem(KEY);if(raw){var y=JSON.parse(raw);for(var k in y)x[k]=y[k]}}catch(e){}if(!Array.isArray(x.records))x.records=[];return x}
function loadCare(){var x={selected:today(),done:{}};try{var raw=localStorage.getItem(CARE);if(raw){var y=JSON.parse(raw);for(var k in y)x[k]=y[k]}}catch(e){}if(!x.done)x.done={};return x}
var state=load(),care=loadCare();
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function saveCare(){try{localStorage.setItem(CARE,JSON.stringify(care))}catch(e){}}
function addRecord(type,data,d){state.records.push({id:'r'+Date.now()+Math.random(),type:type,date:d||today(),data:data||{},created:Date.now()});save()}
function records(type){var a=[];for(var i=0;i<state.records.length;i++)if(state.records[i]&&state.records[i].type===type)a.push(state.records[i]);a.sort(function(x,y){return String(x.date||'').localeCompare(String(y.date||''))});return a}
function latest(type){var a=records(type);return a.length?a[a.length-1]:null}
function setNav(view){var bs=nav.getElementsByTagName('button');for(var i=0;i<bs.length;i++)bs[i].className=bs[i].getAttribute('data-view')===view?'on':''}
function toast(t){toastEl.textContent=t;toastEl.className='toast show';clearTimeout(toast.x);toast.x=setTimeout(function(){toastEl.className='toast'},1600)}
function photo(){try{return localStorage.getItem(PHOTO)||''}catch(e){return ''}}
var ph=photo();if(ph)document.getElementById('avatar').innerHTML='<img src="'+ph+'" alt="Torti">';
var menus=[['Hojas variadas + escarola','Base vegetal variada'],['Diente de león + hibisco','Hojas y flores'],['Endivia + berros + zapallo','Rotación vegetal'],['Morera + escarola','Base conocida'],['Hojas + pequeña porción de papaya','Fruta ocasional'],['Mezcla de hojas seguras','Variedad'],['Mezcla vegetal + mango o fresa','Fruta ocasional y moderada']];
function menuFor(s){var d=date(s).getDay();return menus[(d+6)%7]}
function tasks(s){var arr=[['water','💧','08:00','Cambiar agua','Agua limpia y recipiente revisado'],['habitat','🌡️','08:15','Revisar hábitat','Temperatura, humedad y UVB'],['meal','🥬','09:00','Comida principal',menuFor(s)[0]],['clean','🧹','18:30','Limpieza rápida','Retirar restos y suciedad visible']];var day=date(s).getDay();if(day===0)arr.push(['health','❤️','10:00','Chequeo visual','Actividad, ojos, nariz, caparazón y heces']);var epoch=date('2026-01-01'),dif=Math.round((date(s)-epoch)/86400000);if(Math.abs(dif)%30===0){arr.push(['weight','⚖️','09:30','Peso y medidas','Registrar crecimiento']);arr.push(['shell','📸','10:30','Foto de caparazón','Mantener el mismo ángulo'])}return arr.sort(function(a,b){return a[2].localeCompare(b[2])})}
function key(s,id){return s+':'+id}function done(s,id){return !!care.done[key(s,id)]}
function toggleTask(s,id){var k=key(s,id);if(care.done[k])delete care.done[k];else care.done[k]=1;saveCare();render('care')}
function completion(s){var t=tasks(s),n=0;for(var i=0;i<t.length;i++)if(done(s,t[i][0]))n++;return Math.round(n/t.length*100)}
function home(){var w=latest('peso'),f=latest('comida'),h=latest('habitat'),sel=today(),todayTasks=tasks(sel),pending=0;for(var i=0;i<todayTasks.length;i++)if(!done(sel,todayTasks[i][0]))pending++;return '<section class="hero"><div class="eyebrow">ASÍ ESTÁ TORTI HOY</div><h2>Todo lo importante, sin buscarlo.</h2><p>Cuidados, crecimiento y alimentación organizados en una sola vista.</p><div class="hero-grid"><div class="hero-metric"><small>Último peso</small><b>'+(w&&w.data&&w.data.weight?esc(w.data.weight)+' g':'Pendiente')+'</b></div><div class="hero-metric"><small>Agenda de hoy</small><b>'+completion(sel)+'% lista</b></div><div class="hero-metric"><small>Pendientes</small><b>'+pending+'</b></div></div></section><div class="section-title"><h2>Accesos rápidos</h2><span>'+state.records.length+' registros</span></div><div class="quick"><button data-jump="weight"><span>⚖️</span><b>Registrar peso</b><small>Medidas y evolución</small></button><button data-jump="food"><span>🥬</span><b>Registrar comida</b><small>Apetito y alimentos</small></button><button data-jump="care"><span>📅</span><b>Ver agenda</b><small>Día y semana</small></button><button data-jump="more"><span>🩺</span><b>Ficha de Torti</b><small>Respaldo y resumen</small></button></div><div class="section-title"><h2>Hoy</h2><span>'+fmt(sel)+'</span></div><section class="card">'+todayTasks.slice(0,4).map(function(t){return '<div class="row"><div class="ico">'+t[1]+'</div><div class="grow"><b>'+esc(t[3])+'</b><small>'+t[2]+' · '+esc(t[4])+'</small></div><span class="pill">'+(done(sel,t[0])?'Hecho':'Pendiente')+'</span></div>'}).join('')+'</section><div class="section-title"><h2>Resumen</h2><span>últimos registros</span></div><section class="card"><div class="grid"><div class="metric"><small>Última comida</small><b style="font-size:15px">'+(f&&f.data?esc(f.data.food||'Registrada'):'Sin registro')+'</b></div><div class="metric"><small>Hábitat</small><b style="font-size:15px">'+(h?fmt(h.date):'Pendiente')+'</b></div></div></section>'}
function weight(){var ws=records('peso').slice(-10).reverse(),chart=records('peso').slice(-8),max=0;for(var i=0;i<chart.length;i++){var n=+(chart[i].data||{}).weight||0;if(n>max)max=n}var bars=chart.map(function(r){var n=+(r.data||{}).weight||0,h=max?Math.max(14,Math.round(n/max*125)):14;return '<div class="bar" style="height:'+h+'px"><span>'+esc(n||'')+'</span></div>'}).join('');return '<div class="section-title"><h2>Crecimiento</h2><span>peso y medidas</span></div><section class="card"><h3>Evolución reciente</h3>'+(chart.length>1?'<div class="chart">'+bars+'</div>':'<p class="muted">Añade al menos 2 pesos para ver la evolución.</p>')+'</section><section class="card"><h3>Nueva medición</h3><form id="wf" class="form"><div class="grid"><label>Peso (g)<input name="weight" type="number" required></label><label>Fecha<input name="date" type="date" value="'+today()+'"></label></div><div class="grid"><label>Largo (cm)<input name="length" type="number" step="0.1"></label><label>Ancho (cm)<input name="width" type="number" step="0.1"></label></div><button>Guardar medición</button></form></section><section class="card"><h3>Historial</h3>'+(ws.length?ws.map(function(r){return '<div class="row"><div class="ico">⚖️</div><div class="grow"><b>'+esc((r.data||{}).weight||'—')+' g</b><small>'+fmt(r.date)+' · '+esc((r.data||{}).length||'—')+' cm largo · '+esc((r.data||{}).width||'—')+' cm ancho</small></div></div>'}).join(''):'<p class="muted">Sin mediciones todavía.</p>')+'</section>'}
function food(){var fs=records('comida').slice(-10).reverse(),m=menuFor(today());return '<div class="section-title"><h2>Nutrición</h2><span>variedad y apetito</span></div><div class="food-suggest"><small>MENÚ SUGERIDO DE HOY</small><h3>'+esc(m[0])+'</h3><div class="muted">'+esc(m[1])+' · guía orientativa y editable.</div></div><section class="card"><h3>Registrar comida</h3><form id="ff" class="form"><label>Alimento<input name="food" value="'+esc(m[0])+'" required></label><div class="grid"><label>Apetito<select name="appetite"><option>Bueno</option><option>Regular</option><option>Bajo</option><option>No comió</option></select></label><label>Fecha<input name="date" type="date" value="'+today()+'"></label></div><button>Guardar comida</button></form></section><section class="card"><h3>Comidas recientes</h3>'+(fs.length?fs.map(function(r){return '<div class="row"><div class="ico">🥬</div><div class="grow"><b>'+esc((r.data||{}).food||'—')+'</b><small>'+fmt(r.date)+' · apetito '+esc((r.data||{}).appetite||'—')+'</small></div></div>'}).join(''):'<p class="muted">Sin comidas registradas.</p>')+'</section>'}
function careView(){var start=care.selected;var d=date(start),dow=(d.getDay()+6)%7;d.setDate(d.getDate()-dow);var mon=iso(d),days=[],i;for(i=0;i<7;i++)days.push(addDays(mon,i));var ts=tasks(care.selected),m=menuFor(care.selected);return '<div class="section-title"><h2>Agenda de Torti</h2><span>'+completion(care.selected)+'% completado</span></div><section class="card"><div class="calendar-strip">'+days.map(function(x){return '<button class="daybtn '+(x===care.selected?'on':'')+'" data-day="'+x+'"><small>'+dayName(x)+'</small><b>'+date(x).getDate()+'</b><em>'+completion(x)+'%</em></button>'}).join('')+'</div></section><div class="food-suggest"><small>'+dayName(care.selected)+' · COMIDA RECOMENDADA</small><h3>'+esc(m[0])+'</h3><div class="muted">'+esc(m[1])+'</div></div><section class="card"><h3>'+fmt(care.selected)+' · rutina</h3>'+ts.map(function(t){var is=done(care.selected,t[0]);return '<div class="task '+(is?'done':'')+'"><div class="ico">'+t[1]+'</div><div><b>'+t[2]+' · '+esc(t[3])+'</b><small>'+esc(t[4])+'</small></div><button data-task="'+t[0]+'">'+(is?'✓':'Marcar')+'</button></div>'}).join('')+'</section><section class="card"><h3>Frecuencias</h3><div class="row"><div class="ico">💧</div><div class="grow"><b>Agua</b><small>Todos los días</small></div></div><div class="row"><div class="ico">❤️</div><div class="grow"><b>Chequeo visual</b><small>1 vez por semana</small></div></div><div class="row"><div class="ico">⚖️</div><div class="grow"><b>Peso y medidas</b><small>Cada 30 días</small></div></div><div class="row"><div class="ico">📸</div><div class="grow"><b>Fotos del caparazón</b><small>Cada 30 días</small></div></div><p class="muted">La agenda organiza cuidados; no sustituye una pauta veterinaria individual.</p></section>'}
function more(){var w=latest('peso'),f=latest('comida'),h=latest('salud');return '<div class="section-title"><h2>Ficha de Torti</h2><span>centro personal</span></div><section class="card"><div class="row"><div class="ico">🐢</div><div class="grow"><b>Torti</b><small>Hembra · Chelonoidis denticulatus · edad aproximada</small></div></div><div class="grid" style="margin-top:10px"><div class="metric"><small>Registros</small><b>'+state.records.length+'</b></div><div class="metric"><small>Último peso</small><b>'+(w&&w.data&&w.data.weight?esc(w.data.weight)+' g':'—')+'</b></div></div></section><section class="card"><h3>Estado reciente</h3><div class="row"><div class="ico">🥬</div><div class="grow"><b>Alimentación</b><small>'+(f?fmt(f.date)+' · '+esc((f.data||{}).appetite||'registrada'):'Sin registro')+'</small></div></div><div class="row"><div class="ico">❤️</div><div class="grow"><b>Salud</b><small>'+(h?fmt(h.date):'Sin control reciente')+'</small></div></div></section><section class="card"><h3>Seguridad de datos</h3><p class="muted">Tus registros se guardan en este dispositivo. Puedes exportar una copia cuando quieras.</p><button class="btn" id="backup">Exportar respaldo JSON</button></section><section class="card"><h3>Versión estable</h3><div class="notice">Esta edición mantiene todo en un solo archivo para priorizar estabilidad en iPhone.</div></section>'}
function bind(view){if(view==='home'){var js=main.querySelectorAll('[data-jump]');for(var i=0;i<js.length;i++)js[i].onclick=function(){render(this.getAttribute('data-jump'))}}if(view==='weight'){var wf=document.getElementById('wf');if(wf)wf.onsubmit=function(e){e.preventDefault();var f=new FormData(this);addRecord('peso',{weight:f.get('weight'),length:f.get('length'),width:f.get('width')},f.get('date'));toast('Medición guardada');render('weight')}}if(view==='food'){var ff=document.getElementById('ff');if(ff)ff.onsubmit=function(e){e.preventDefault();var f=new FormData(this);addRecord('comida',{food:f.get('food'),appetite:f.get('appetite')},f.get('date'));toast('Comida registrada');render('food')}}if(view==='care'){var ds=main.querySelectorAll('[data-day]');for(var j=0;j<ds.length;j++)ds[j].onclick=function(){care.selected=this.getAttribute('data-day');saveCare();render('care')};var ts=main.querySelectorAll('[data-task]');for(var k=0;k<ts.length;k++)ts[k].onclick=function(){toggleTask(care.selected,this.getAttribute('data-task'));toast('Agenda actualizada')}}if(view==='more'){var b=document.getElementById('backup');if(b)b.onclick=function(){try{var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='torti-backup-'+today()+'.json';a.click();toast('Respaldo preparado')}catch(e){alert('No se pudo exportar el respaldo.')}}}}
function render(view){setNav(view);try{main.innerHTML=view==='home'?home():view==='weight'?weight():view==='food'?food():view==='care'?careView():more();bind(view);window.scrollTo(0,0)}catch(err){main.innerHTML='<section class="card"><h2>Error visible</h2><div class="error">'+esc(err&&err.message?err.message:String(err))+'</div></section>'}}
nav.onclick=function(e){var t=e.target;while(t&&t!==nav&&!t.getAttribute('data-view'))t=t.parentNode;if(t&&t.getAttribute)render(t.getAttribute('data-view'))};
window.onerror=function(msg,src,line){main.innerHTML='<section class="card"><h2>Error de JavaScript</h2><div class="error">'+esc(msg)+'\nLínea '+line+'</div></section>';return false};
render('home');
})();
</script>
</body>
</html>
