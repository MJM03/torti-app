<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17392b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Torti">
<title>Torti — Mi tortuga · V4</title>
<link rel="manifest" href="manifest.webmanifest?v=4.0.1">
<link rel="icon" href="icon.svg?v=4.0.1" type="image/svg+xml">
<link rel="stylesheet" href="v4.css?v=4.0.1">
<style>html,body{margin:0;min-height:100%;background:#f5f2ea}#boot{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;color:#173028;padding:24px;text-align:center}#boot div{max-width:360px}#boot b{display:block;font-size:28px;margin:10px 0}#boot small{color:#6f7b75;line-height:1.5}.boot-dot{font-size:46px}</style>
</head>
<body>
<div id="boot"><div><div class="boot-dot">🐢</div><b>Cargando Torti V4</b><small>Recuperando la app y tus datos guardados…</small></div></div>
<script>
(async()=>{
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      for(const r of regs) await r.unregister();
      if('caches' in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}
    }
  }catch(e){}
  const s=document.createElement('script');
  s.src='v4.js?v=4.0.1';
  s.onload=()=>document.getElementById('boot')?.remove();
  s.onerror=()=>{const b=document.getElementById('boot');if(b)b.innerHTML='<div><div class="boot-dot">🐢</div><b>No cargó la actualización</b><small>Recarga esta página una vez. Tus registros siguen guardados en el dispositivo.</small></div>'};
  document.body.appendChild(s);
})();
</script>
</body>
</html>
