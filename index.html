<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123a2d"><title>Torti — Mi tortuga</title><style>:root{--bg:#f3f0e7;--card:#fffdf8;--ink:#183129;--muted:#748079;--line:#e7e2d7;--green:#123a2d;--soft:#edf4ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}.app{max-width:760px;margin:auto;padding:0 12px 115px}.top{display:flex;justify-content:space-between;align-items:center;padding:calc(18px + env(safe-area-inset-top)) 4px 12px}.brand small{color:var(--muted);font-weight:900;letter-spacing:.1em}.brand h1{font-size:34px;margin:5px 0 2px}.muted,.brand p{color:var(--muted);font-size:13px;line-height:1.45;margin:0}.avatar{width:58px;height:58px;border-radius:20px;background:var(--green);display:grid;place-items:center;font-size:29px;color:#fff;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.hero,.budget{background:linear-gradient(135deg,#173f31,#285746);color:#fff;border-radius:28px;padding:20px;margin:5px 0 14px}.hero h2,.budget h2{font-size:27px;margin:8px 0}.hero p{opacity:.82}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:17px}.metric{background:var(--soft);border-radius:16px;padding:11px}.hero .metric,.budget .metric{background:rgba(255,255,255,.11)}.metric small,.metric b{display:block}.metric small{font-size:11px;color:var(--muted)}.hero .metric small,.budget .metric small{color:rgba(255,255,255,.72)}.metric b{font-size:18px;margin-top:4px}.title{display:flex;justify-content:space-between;align-items:end;gap:8px;margin:20px 5px 9px}.title h2{font-size:22px;margin:0}.title span{font-size:12px;color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:17px;margin:10px 0}.card h3{margin:0 0 10px}.quick,.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick button{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:15px;text-align:left;color:var(--ink);min-height:88px}.quick span{font-size:24px;display:block}.quick b,.quick small{display:block;margin-top:5px}.quick small{color:var(--muted)}.form label{display:block;font-size:13px;font-weight:800;margin:11px 0}.form input,.form select{width:100%;padding:13px;border:1px solid var(--line);border-radius:14px;background:#fff;font-size:16px}.form button,.btn{width:100%;border:0;border-radius:14px;padding:14px;background:var(--green);color:#fff;font-weight:900}.row{display:flex;gap:11px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.row:first-child{border:0}.ico{width:42px;height:42px;flex:0 0 42px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:20px}.grow{min-width:0;flex:1}.grow b,.grow small{display:block}.grow small{color:var(--muted);margin-top:3px}.meal{background:linear-gradient(135deg,#f4ecd9,#eee0be);border:1px solid #ead8ae;border-radius:24px;padding:17px}.meal h3{font-size:22px;margin:5px 0}.meal button,.task button,.buy{border:0;border-radius:12px;padding:10px 12px;background:var(--soft);color:var(--green);font-weight:900}.meal button{margin-top:13px;background:#fff8e9}.meal button.done,.task.done button,.buy.done{background:var(--green);color:#fff}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{border:1px solid var(--line);background:#fff;border-radius:14px;padding:9px 2px}.day small,.day b{display:block}.day.on{background:var(--green);color:#fff}.task{display:grid;grid-template-columns:42px minmax(0,1fr);gap:12px;padding:15px 0;border-top:1px solid var(--line)}.task:first-child{border:0}.task-title{display:flex;gap:7px;flex-wrap:wrap;align-items:baseline}.time{font-size:13px;font-weight:900;color:var(--green)}.task-name{font-weight:850}.task-desc{display:block;color:var(--muted);font-size:13px;line-height:1.4;margin:5px 0 9px}.saving{background:#eaf4ec;border:1px solid #d4e7d8;border-radius:18px;padding:14px;margin:11px 0}.saving b{display:block;margin-bottom:5px}.shop{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;padding:14px 0;border-top:1px solid var(--line)}.shop:first-child{border:0}.shop b,.shop small{display:block}.shop small{color:var(--muted);line-height:1.4;margin-top:3px}.shopfoot{display:flex;justify-content:space-between;align-items:center;margin-top:9px}.price{font-weight:900;font-size:17px}.tag{display:inline-block;background:var(--soft);padding:5px 8px;border-radius:999px;font-size:10px;font-weight:900;margin-top:5px}.chart{background:#f8f7f2;border:1px solid var(--line);border-radius:20px;padding:10px}.chart svg{width:100%;height:180px}.projection{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.note{background:#f7f0df;border:1px solid #ead8ae;border-radius:17px;padding:13px;color:#6f5831;font-size:12px;line-height:1.45;margin-top:10px}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(760px,100%);display:grid;grid-template-columns:repeat(6,1fr);background:rgba(255,253,248,.96);border-top:1px solid var(--line);padding:7px 3px calc(7px + env(safe-area-inset-bottom));z-index:10;backdrop-filter:blur(20px)}.nav button{border:0;background:none;min-height:58px;color:#7b867f;font-weight:800;font-size:9px;border-radius:14px}.nav i{display:block;font-style:normal;font-size:20px}.nav button.on{background:var(--soft);color:var(--green)}.toast{position:fixed;left:50%;bottom:95px;transform:translateX(-50%);background:var(--green);color:#fff;padding:10px 14px;border-radius:999px;display:none;z-index:20}@media(max-width:430px){.metrics,.projection{grid-template-columns:1fr 1fr}.metrics .metric:last-child,.projection .metric:last-child{grid-column:1/-1}.nav button{font-size:8px}}</style></head><body><div class="app"><header class="top"><div class="brand"><small>TORTI · V4.5 BELLAVISTA</small><h1>Torti</h1><p>Mi tortuga · seguimiento diario</p></div><div class="avatar" id="avatar">🐢</div></header><main id="main"></main></div><nav class="nav" id="nav"><button data-v="home" class="on"><i>⌂</i>Inicio</button><button data-v="weight"><i>↗</i>Crece</button><button data-v="food"><i>🥬</i>Comida</button><button data-v="care"><i>📅</i>Agenda</button><button data-v="shop"><i>🛒</i>Compras</button><button data-v="more"><i>🐢</i>Torti</button></nav><div class="toast" id="toast"></div><script>(function(){'use strict';var K='torti-v1-data',P='torti-v1-photo',C='torti-v4-stable-care',S='torti-v4-shopping',R='torti-v4-profile',main=document.getElementById('main'),nav=document.getElementById('nav'),te=document.getElementById('toast');function pad(n){return n<10?'0'+n:n}function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}function dt(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2],12)}function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}function add(s,n){var d=dt(s);d.setDate(d.getDate()+n);return iso(d)}function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function get(k,d){try{var x=JSON.parse(localStorage.getItem(k)||'null');return x||d}catch(e){return d}}var state=get(K,{records:[]});if(!Array.isArray(state.records))state.records=[];var care=get(C,{selected:today(),done:{}});if(!care.done)care.done={};var profile=get(R,{ageYears:3});var items=[['🥬','Escarola',2,3,'Fácil','2 unidades/porciones al mes.'],['🌿','Berros',2,2.5,'Fácil','2 atados pequeños al mes.'],['🥬','Lechuga romana',2,3,'Fácil','Alternativa común para rotar; no usar como único alimento.'],['🎃','Zapallo macre',2,2.5,'Fácil','2 porciones pequeñas al mes.'],['🥕','Zanahoria',1,1.5,'Fácil','Pequeña cantidad para rotación ocasional.'],['🍈','Papaya',1,3,'Fácil','Porción pequeña, ocasional.'],['🍓','Fresa',1,2,'Fácil','Porción pequeña, ocasional.'],['🌿','Morera',0,0,'Opcional','No entra al presupuesto base. Úsala solo si encuentras hojas seguras sin pesticidas.'],['🌺','Hibisco',0,0,'Opcional','No entra al presupuesto base. Mejor de vivero/fuente segura si consigues.'],['💧','Agua',1,0,'Casa','Agua de casa.'],['🧽','Esponja/cepillo exclusivo',1,4,'Fácil','Solo si toca reemplazarlo.'],['🌱','Reserva sustrato',1,8,'Reserva','Fondo mensual.'],['☀️','Reserva UVB',1,8,'Reserva','Fondo mensual.'],['🧴','Reserva calcio',1,5,'Reserva','Fondo mensual.']];var shop=get(S,{month:today().slice(0,7),bought:{},items:items,budgetVersion:'bellavista-v1'});if(shop.budgetVersion!=='bellavista-v1'){shop={month:today().slice(0,7),bought:{},items:items,budgetVersion:'bellavista-v1'}}function save(k,x){localStorage.setItem(k,JSON.stringify(x))}save(S,shop);var photo='';try{photo=localStorage.getItem(P)||''}catch(e){}if(photo)document.getElementById('avatar').innerHTML='<img src="'+photo+'">';function rec(t){return state.records.filter(function(r){return r&&r.type===t}).sort(function(a,b){return String(a.date||'').localeCompare(String(b.date||''))})}function latest(t){var a=rec(t);return a.length?a[a.length-1]:null}function addrec(t,data,date){state.records.push({id:'r'+Date.now(),type:t,date:date||today(),data:data});save(K,state)}function toast(s){te.textContent=s;te.style.display='block';setTimeout(function(){te.style.display='none'},1300)}var menus=[['Escarola + berros','Productos fáciles del mercado.'],['Lechuga romana + zapallo','Rotación económica con una pequeña porción de zapallo.'],['Escarola + lechuga romana','Día de hojas fáciles de conseguir.'],['Berros + escarola','Rotación simple sin ingredientes raros.'],['Lechuga romana + pequeña zanahoria','Zanahoria solo como complemento pequeño.'],['Escarola + berros','Repite los productos para aprovechar toda la compra.'],['Escarola + berros + poca papaya o fresa','Fruta ocasional en poca cantidad.']];function menu(s){return menus[(dt(s).getDay()+6)%7]}function tasks(s){var a=[['water','💧','08:00','Cambiar agua','Agua limpia y recipiente revisado'],['hab','🌡️','08:15','Revisar hábitat','Temperatura, humedad, UVB y estado general'],['meal','🥬','09:00','Comida',menu(s)[0]],['clean','🧹','18:30','Limpieza rápida','Retirar restos y suciedad visible']];if(dt(s).getDay()===0)a.push(['health','❤️','10:00','Chequeo visual','Actividad, ojos, nariz, caparazón y heces']);return a}function key(s,id){return s+':'+id}function done(s,id){return !!care.done[key(s,id)]}function completion(s){var a=tasks(s),n=0;a.forEach(function(x){if(done(s,x[0]))n++});return Math.round(n/a.length*100)}function total(){return shop.items.reduce(function(a,x){return a+(+x[2]||0)*(+x[3]||0)},0)}function spent(){return shop.items.reduce(function(a,x,i){return a+(shop.bought[i]?(+x[2]||0)*(+x[3]||0):0)},0)}function series(k){return rec('peso').filter(function(r){return r.data&&+r.data[k]>0}).map(function(r){return{date:r.date,value:+r.data[k]}})}function chart(a,u){if(a.length<2)return '<p class="muted">Registra al menos 2 mediciones para ver la gráfica.</p>';var w=320,h=160,p=24,min=a[0].value,max=min;a.forEach(function(x){min=Math.min(min,x.value);max=Math.max(max,x.value)});if(max===min)max=min+1;var st=dt(a[0].date).getTime(),en=dt(a[a.length-1].date).getTime();if(en===st)en=st+1;var pts=a.map(function(x){return[p+(dt(x.date)-st)/(en-st)*(w-2*p),h-p-(x.value-min)/(max-min)*(h-2*p)]});return '<svg viewBox="0 0 320 160"><line x1="24" y1="136" x2="296" y2="136" stroke="#ddd"/><polyline fill="none" stroke="#285746" stroke-width="4" points="'+pts.map(function(q){return q[0]+','+q[1]}).join(' ')+'"/>'+pts.map(function(q){return '<circle cx="'+q[0]+'" cy="'+q[1]+'" r="4" fill="#123a2d"/>'}).join('')+'<text x="25" y="17" font-size="11" fill="#748079">'+max.toFixed(u==='g'?0:1)+' '+u+'</text></svg>'}function project(a,m){if(a.length<2)return null;var first=a[0],last=a[a.length-1],months=(dt(last.date)-dt(first.date))/2629800000;if(months<=0)return null;return Math.max(0,last.value+(last.value-first.value)/months*m)}function home(){var w=latest('peso');return '<section class="hero"><small>TORTI HOY</small><h2>Cuidados simples y compras reales.</h2><p>Menú adaptado a productos comunes de mercado y opciones raras fuera del presupuesto base.</p><div class="metrics"><div class="metric"><small>Peso</small><b>'+(w&&w.data.weight?esc(w.data.weight)+' g':'Pendiente')+'</b></div><div class="metric"><small>Agenda</small><b>'+completion(today())+'%</b></div><div class="metric"><small>Presupuesto</small><b>S/ '+total().toFixed(0)+'</b></div></div></section><div class="title"><h2>Accesos rápidos</h2></div><div class="quick"><button data-j="weight"><span>⚖️</span><b>Registrar medida</b><small>Peso y tamaño</small></button><button data-j="food"><span>🥬</span><b>Comida</b><small>Menú de mercado</small></button><button data-j="care"><span>📅</span><b>Agenda</b><small>Cuidados</small></button><button data-j="shop"><span>🛒</span><b>Compras</b><small>Lista Bellavista</small></button></div>'}function weight(){var a=rec('peso').slice(-8).reverse();return '<div class="title"><h2>Crecimiento</h2></div><section class="card"><form id="wf" class="form"><div class="grid"><label>Peso (g)<input name="weight" type="number" required></label><label>Fecha<input name="date" type="date" value="'+today()+'"></label></div><div class="grid"><label>Largo caparazón (cm)<input name="length" type="number" step=".1"></label><label>Ancho (cm)<input name="width" type="number" step=".1"></label></div><button>Guardar medición</button></form></section><section class="card"><h3>Historial</h3>'+a.map(function(r){return '<div class="row"><div class="ico">⚖️</div><div class="grow"><b>'+esc(r.data.weight||'—')+' g</b><small>'+esc(r.date)+' · '+esc(r.data.length||'—')+' cm largo · '+esc(r.data.width||'—')+' cm ancho</small></div></div>'}).join('')+'</section>'}function food(){var m=menu(today()),a=rec('comida').slice(-6).reverse();return '<div class="title"><h2>Nutrición</h2><span>mercado fácil</span></div><section class="meal"><small>MENÚ DE HOY</small><h3>'+esc(m[0])+'</h3><p class="muted">'+esc(m[1])+'</p></section><section class="card"><form id="ff" class="form"><label>Alimento<input name="food" value="'+esc(m[0])+'"></label><div class="grid"><label>Apetito<select name="appetite"><option>Bueno</option><option>Regular</option><option>Bajo</option><option>No comió</option></select></label><label>Fecha<input name="date" type="date" value="'+today()+'"></label></div><button>Guardar comida</button></form></section><section class="card"><h3>Recientes</h3>'+a.map(function(r){return '<div class="row"><div class="ico">🥬</div><div class="grow"><b>'+esc(r.data.food)+'</b><small>'+esc(r.date)+'</small></div></div>'}).join('')+'</section>'}function careView(){var d=dt(care.selected),dow=(d.getDay()+6)%7;d.setDate(d.getDate()-dow);var days=[],i;for(i=0;i<7;i++)days.push(add(iso(d),i));var chores=tasks(care.selected).filter(function(x){return x[0]!=='meal'}),m=menu(care.selected),md=done(care.selected,'meal');return '<div class="title"><h2>Agenda</h2><span>'+completion(care.selected)+'% listo</span></div><section class="card"><div class="days">'+days.map(function(x){return '<button class="day '+(x===care.selected?'on':'')+'" data-day="'+x+'"><small>'+['D','L','M','M','J','V','S'][dt(x).getDay()]+'</small><b>'+dt(x).getDate()+'</b></button>'}).join('')+'</div></section><div class="title"><h2>Comida</h2></div><section class="meal"><small>09:00 · MENÚ DE MERCADO</small><h3>'+esc(m[0])+'</h3><p class="muted">'+esc(m[1])+'</p><button class="'+(md?'done':'')+'" data-task="meal">'+(md?'✓ Comida hecha':'Marcar comida')+'</button></section><div class="title"><h2>Quehaceres</h2></div><section class="card">'+chores.map(function(t){var ok=done(care.selected,t[0]);return '<div class="task '+(ok?'done':'')+'"><div class="ico">'+t[1]+'</div><div><div class="task-title"><span class="time">'+t[2]+'</span><span class="task-name">'+esc(t[3])+'</span></div><span class="task-desc">'+esc(t[4])+'</span><button data-task="'+t[0]+'">'+(ok?'✓ Hecho':'Marcar')+'</button></div></div>'}).join('')+'</section>'}function shopView(){var t=total(),sp=spent();return '<div class="title"><h2>Compras Bellavista</h2><span>modo económico</span></div><section class="budget"><small>PRESUPUESTO BASE</small><h2>S/ '+t.toFixed(2)+'</h2><div class="metrics"><div class="metric"><small>Comprado</small><b>S/ '+sp.toFixed(2)+'</b></div><div class="metric"><small>Falta</small><b>S/ '+Math.max(0,t-sp).toFixed(2)+'</b></div><div class="metric"><small>Semana</small><b>S/ '+(t/4.3).toFixed(2)+'</b></div></div></section><div class="saving"><b>🏪 Pensado para un mercado común</b><span class="muted">Escarola, berros, lechuga romana, zapallo, zanahoria, papaya y fresa forman el menú base. Morera e hibisco quedan opcionales: si no aparecen en el mercado, Torti no los necesita para cumplir este menú.</span></div><section class="card"><h3>Lista producto por producto</h3>'+shop.items.map(function(x,i){var sub=(+x[2]||0)*(+x[3]||0),ok=!!shop.bought[i];return '<div class="shop"><div class="ico">'+x[0]+'</div><div><b>'+esc(x[1])+'</b><span class="tag">'+esc(x[4])+'</span><small>'+esc(x[5])+'</small><small>'+x[2]+' × S/ '+(+x[3]).toFixed(2)+'</small><div class="shopfoot"><span class="price">S/ '+sub.toFixed(2)+'</span><button class="buy '+(ok?'done':'')+'" data-buy="'+i+'">'+(ok?'✓':'Comprar')+'</button></div></div></div>'}).join('')+'</section><section class="card"><h3>Ajustar precio real</h3><form id="sf" class="form"><label>Producto<select name="idx">'+shop.items.map(function(x,i){return '<option value="'+i+'">'+esc(x[1])+'</option>'}).join('')+'</select></label><div class="grid"><label>Cantidad/mes<input name="qty" type="number" min="0"></label><label>Precio unitario S/<input name="price" type="number" min="0" step=".1"></label></div><button>Actualizar</button></form></section>'}function more(){var w=series('weight'),l=series('length');function pv(v,u){return v==null?'—':(u==='g'?Math.round(v):v.toFixed(1))+' '+u}return '<div class="title"><h2>Torti</h2><span>crecimiento</span></div><section class="card"><div class="row"><div class="ico">🐢</div><div class="grow"><b>Torti</b><small>Hembra · especie probable: Chelonoidis denticulatus</small></div></div><form id="age" class="form"><label>Edad aproximada (años)<input name="age" type="number" min="0" step=".1" value="'+profile.ageYears+'"></label><button>Actualizar edad</button></form></section><section class="card"><h3>Peso</h3><div class="chart">'+chart(w.slice(-10),'g')+'</div></section><section class="card"><h3>Largo del caparazón</h3><div class="chart">'+chart(l.slice(-10),'cm')+'</div></section><section class="card"><h3>Proyección según sus propios registros</h3><div class="projection"><div class="metric"><small>+6 meses</small><b>'+pv(project(w,6),'g')+'</b><small>'+pv(project(l,6),'cm')+'</small></div><div class="metric"><small>+12 meses</small><b>'+pv(project(w,12),'g')+'</b><small>'+pv(project(l,12),'cm')+'</small></div><div class="metric"><small>+24 meses</small><b>'+pv(project(w,24),'g')+'</b><small>'+pv(project(l,24),'cm')+'</small></div></div><div class="note">La proyección es matemática y usa la tendencia de Torti; no representa un peso ideal médico. Necesita al menos dos mediciones en fechas distintas.</div></section><section class="card"><button class="btn" id="backup">Exportar respaldo JSON</button></section>'}function bind(v){Array.prototype.forEach.call(main.querySelectorAll('[data-j]'),function(b){b.onclick=function(){render(this.getAttribute('data-j'))}});var f;if(v==='weight'&&(f=document.getElementById('wf')))f.onsubmit=function(e){e.preventDefault();var d=new FormData(this);addrec('peso',{weight:d.get('weight'),length:d.get('length'),width:d.get('width')},d.get('date'));toast('Medición guardada');render(v)};if(v==='food'&&(f=document.getElementById('ff')))f.onsubmit=function(e){e.preventDefault();var d=new FormData(this);addrec('comida',{food:d.get('food'),appetite:d.get('appetite')},d.get('date'));toast('Comida guardada');render(v)};Array.prototype.forEach.call(main.querySelectorAll('[data-day]'),function(b){b.onclick=function(){care.selected=this.getAttribute('data-day');save(C,care);render('care')}});Array.prototype.forEach.call(main.querySelectorAll('[data-task]'),function(b){b.onclick=function(){var z=key(care.selected,this.getAttribute('data-task'));if(care.done[z])delete care.done[z];else care.done[z]=1;save(C,care);render('care')}});Array.prototype.forEach.call(main.querySelectorAll('[data-buy]'),function(b){b.onclick=function(){var i=this.getAttribute('data-buy');shop.bought[i]=!shop.bought[i];save(S,shop);render('shop')}});if(v==='shop'&&(f=document.getElementById('sf')))f.onsubmit=function(e){e.preventDefault();var d=new FormData(this),i=+d.get('idx');if(d.get('qty')!=='')shop.items[i][2]=+d.get('qty');if(d.get('price')!=='')shop.items[i][3]=+d.get('price');save(S,shop);toast('Precio actualizado');render(v)};if(v==='more'&&(f=document.getElementById('age')))f.onsubmit=function(e){e.preventDefault();var d=new FormData(this);profile.ageYears=+d.get('age')||profile.ageYears;save(R,profile);render(v)};var b=document.getElementById('backup');if(b)b.onclick=function(){var a=document.createElement('a'),blob=new Blob([JSON.stringify({state:state,care:care,shop:shop,profile:profile},null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='torti-backup-'+today()+'.json';a.click()}}function render(v){Array.prototype.forEach.call(nav.querySelectorAll('button'),function(b){b.className=b.getAttribute('data-v')===v?'on':''});main.innerHTML=v==='home'?home():v==='weight'?weight():v==='food'?food():v==='care'?careView():v==='shop'?shopView():more();bind(v);scrollTo(0,0)}nav.onclick=function(e){var t=e.target;while(t&&t!==nav&&!t.getAttribute('data-v'))t=t.parentNode;if(t&&t.getAttribute)render(t.getAttribute('data-v'))};render('home')})();</script></body></html>
